# Tools distributed as ready-made binaries. Go tooling that is cheap to build
# lives in go.mod as a `tool` directive instead (air, ent, ogen, goverter,
# goi18n) and is invoked as `go tool <name>`.
[tools]
go = "1.27.3"
# node + pnpm: the frontend and the TypeSpec/openapi-ts tooling share the root
# package.json. Pinned here so local dev and CI run the same versions.
node = "26.12.1"
pnpm = "12.15.0"
# golangci-lint: deliberately NOT a `go tool`. It is a Go module and works that
# way, but a tool directive means building the linter and its whole analyzer
# tree from source (~590 lines of go.mod/go.sum, a multi-minute cold build)
# where mise just fetches the released binary.
golangci-lint = "2.15.0"
# atlas: owns the DB schema going forward (versioned migrations). Tests apply
# migrations through the Atlas Go library; new changes = atlas migrate new.
# Cannot become a `go tool`: the public `ariga.io/atlas/cmd/atlas` module is
# frozen at a 2024-11 snapshot of the 0.13.x CLI (the library kept moving to
# 1.x), and even that snapshot refuses to install because its go.mod carries
# replace directives. Community build (Apache-2.0, built from the OSS repo)
# rather than the default MSA-licensed one: `migrate new/hash/apply/diff` are all
# there and no Pro feature is used — see docs/adr/0014. Ariga drops release
# binaries after ~6 months, so this pin must keep moving or `mise install` breaks.
atlas-community = "1.3.0"
# hk: git hooks (hk.pkl); pkl evaluates that config. hk's version must match the
# package:// import at the top of hk.pkl.
hk = "2.8.1"
pkl = "0.32.2"
# pitchfork runs the [daemons] below (`mise daemons ...`).
pitchfork = "2.32.2"
# Structural code search for agents (see AGENTS.md, "Code search").
ast-grep = "0.51.0"
# Secret scan on staged changes (pre-commit hook in hk.pkl).
gitleaks = "8.30.1"
# Workflow linters (mise run lint:workflows), the spelling check (lint:typos) and
# pinact, which pins a workflow's actions to commit SHAs (`pinact run`).
zizmor = "1.31.1"
jactionlint = "2.3.0"
typos = "1.51.1"
pinact = "5.0.1"
# Shell scripts under scripts/ (mise run lint:shell).
shellcheck = "0.11.0"
# Helm chart checks (mise run lint:helm): helm renders the chart, kubeconform
# validates the manifests against the Kubernetes schemas.
helm = "4.3.1"
kubeconform = "0.8.0"
# Terraform under terraform/ (mise run lint:infra); the pin follows
# required_version in versions.tf.
terraform = "1.17.0"
# Guardrails from github.com/mokevnin/dev-quality-gates. squawk lints the migrations a
# change adds (lint:migrations), oasdiff compares the OpenAPI contract with the base
# branch (lint:contract-breaking), vacuum lints the generated contract
# (lint:contract) and agnix the agent instruction files (lint:agents).
"github:sbdchd/squawk" = "2.70.0"
"github:oasdiff/oasdiff" = "1.34.1"
vacuum = "0.35.1"
"github:agent-sh/agnix" = "0.59.3"
# Install the git hooks (hk.pkl) once the toolchain is in place.
[hooks]
postinstall = "hk install --mise"

# Keep dependencies in sync when the lockfiles change (checked on the shell prompt).
[[watch_files]]
patterns = ["pnpm-lock.yaml"]
run = "pnpm install --frozen-lockfile"

[[watch_files]]
patterns = ["go.mod", "go.sum"]
run = "go mod download"

# `daemons` and `watch_files` are experimental in mise.
[settings]
experimental = true

# Real environment variables win over .env, so these steer the dev stack's ports without
# touching the committed .env.example.
[env]
ADDR = ":{{ env.API_PORT }}"
API_URL = "http://localhost:{{ env.API_PORT }}"
# Origin of the /api/storage URLs (blog covers); the default would point at :3001.
PUBLIC_URL = "http://localhost:{{ env.API_PORT }}"
SITE_URL = "http://localhost:{{ env.WEB_PORT }}"
# Required settings with no code default (internal/config); a checkout seeded before they
# became required has neither in its .env.
APP_HOST = "localhost"
BLOB_BUCKET_URL = "file://./storage?create_dir=true"
# The postgres preset exports DATABASE_URL (and PG*) for its own `postgres` database, which
# would beat .env; point the app at the development database instead.
DATABASE_URL = "postgres://postgres:postgres@127.0.0.1:54330/code_basics_development?sslmode=disable"
PGDATABASE = "code_basics_development"

# Development stack: `mise run dev` starts everything below, `mise run dev:down` stops
# the app processes (never the database: it is a standing service, see `db`).
# The port stays 54330 (not 5432) to avoid clashing with a local PostgreSQL;
# .env.example, atlas.hcl and the db:* tasks all point at it. Tests run on this server
# too (TEST_DB_HOST/TEST_DB_PORT override it) but never touch the development database:
# each package clones its own from a template (internal/testsupport/testdb).
[daemons.db]
preset = "postgres"
version = "18"
port = 54330

# api and web take a free port (`auto`, starting at the base): the base when it is free,
# the next free one when another project already holds it. The chosen port is exported as
# <NAME>_PORT (API_PORT, WEB_PORT), and [env] below feeds it to the Go server (ADDR), to
# Vite's /api proxy and SSR client (API_URL) and to the links in emails (SITE_URL).
# `ready_cmd` cannot be templated, so readiness reads the variable. 3001 is the production
# port, so development starts at 3002.
[daemons.api]
run = "exec go tool air"
port = { auto = true, base = 3002 }
ready_cmd = "nc -z localhost $API_PORT"
depends = ["db"]

[daemons.worker]
run = "exec go tool air -c .air.worker.toml"
depends = ["db"]

[daemons.web]
run = "exec pnpm exec vite dev --port $WEB_PORT --strictPort"
port = { auto = true, base = 5173 }
ready_cmd = "nc -z localhost $WEB_PORT"

[task_config]
includes = ["mise/tasks.toml"]

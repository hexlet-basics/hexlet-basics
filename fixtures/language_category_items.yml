# Fixtures for `language_category_items`, HAND-CURATED (legacy had a single
# row). Everything hangs off category_programming_ru so one category page
# has several courses: four published, listed ru pages whose courses differ in
# `order` (three share one, to exercise the tie-breaker), plus an en page the
# ru page must leave out. The javascript pages stay out: a test deletes them,
# and these rows would hold them by foreign key. Landing page ids come from
# language_landing_pages.yml.
- id: {{ id "category_item_programming_ru_typescript_ru" }}
  language_category_id: {{ id "category_programming_ru" }}
  language_landing_page_id: {{ id "landing_page_typescript_ru" }}
  created_at: '2026-07-26 20:50:29'
  updated_at: '2026-07-26 20:50:29'

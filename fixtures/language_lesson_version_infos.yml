# Fixtures for `language_lesson_version_infos`, HAND-CURATED for the Go admin
# read tests. This table drives the admin lesson list (the "current" version's
# info per locale). testfixtures disables FKs during load.
#
# Info ids are deliberately assigned so their DESC order does NOT match the
# lesson-id DESC order: the admin lesson list must sort by the Info id (legacy
# ransack default), but returns the LESSON id as each item's `id`. See
# language_lessons.yml for the lesson slugs.
#
# `version_id` is the LESSON version this row localizes (language_lesson_versions),
# which is what the loader writes and what carries the Position the public reads
# order by. `language_version_id` is the COURSE version. The two id spaces overlap
# by coincidence in these fixtures, so the difference is easy to miss.
#
# Visible in the lesson list (locale=en AND version=version_javascript_current):
- id: {{ id "lesson_version_info_javascript_strings_current_en" }}
  name: Strings
  description: Working with strings
  locale: en
  language_id: {{ id "course_javascript" }}
  language_lesson_id: {{ id "lesson_javascript_strings" }}
  language_version_id: {{ id "version_javascript_current" }}
  version_id: {{ id "lesson_version_javascript_strings_current" }}
  created_at: '2026-07-26 20:50:29'
  updated_at: '2026-07-26 20:50:29'
- id: {{ id "lesson_version_info_javascript_hello_world_current_en" }}
  name: Hello, World!
  description: Your first program
  locale: en
  language_id: {{ id "course_javascript" }}
  language_lesson_id: {{ id "lesson_javascript_hello_world" }}
  language_version_id: {{ id "version_javascript_current" }}
  version_id: {{ id "lesson_version_javascript_hello_world_current" }}
  theory: |
    Every programming journey starts with a program that prints a greeting.
    In JavaScript, `console.log` writes a line to the output.
  instructions: Print `Hello, World!` using `console.log`.
  tips: |
    ---
    - Text in JavaScript is written in quotes
  definitions: |
    ---
    - name: console.log
      description: Prints its argument to the output
  created_at: '2026-07-26 20:50:29'
  updated_at: '2026-07-26 20:50:29'

- id: 2002
  name: Hello, World!
  description: Your first program
  locale: en
  language_id: 82481401
  language_lesson_id: 1001
  language_version_id: 965227298
  version_id: 965227298
  theory: |
    Every programming journey starts with a program that prints a greeting.
    In JavaScript, `console.log` writes a line to the output.
  instructions: Print `Hello, World!` using `console.log`.
  tips: |
    ---
    - Text in JavaScript is written in quotes
  definitions: |
    ---
    - name: console.log
      description: Prints its argument to the output
  created_at: '2026-07-26 20:50:29'
  updated_at: '2026-07-26 20:50:29'

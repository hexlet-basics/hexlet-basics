# Fixtures for `language_lesson_version_infos`, HAND-CURATED for the Go admin
# read tests. This table drives the admin lesson list (the "current" version's
# info per locale). testfixtures disables FKs during load.
#
# Info ids are deliberately assigned so their DESC order does NOT match the
# lesson-id DESC order: the admin lesson list must sort by the Info id (legacy
# ransack default), but returns the LESSON id as each item's `id`. See
# language_lessons.yml for the lesson slugs.
#
# `version_id` is the LESSON version this row localizes (language_lesson_versions),
# which is what the loader writes and what carries the Position the public reads
# order by. `language_version_id` is the COURSE version. The two id spaces overlap
# by coincidence in these fixtures, so the difference is easy to miss.
#

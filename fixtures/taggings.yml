# Fixtures for `taggings`, HAND-CURATED from the legacy Rails fixture:
# `should_be_lead` on a user and on a survey item. user_flagged_as_lead
# holds the user tagging so the lead test can see it go. The survey item shares its id
# on purpose: the polymorphic type, not the id alone, decides what is a user's
# tag. `make fixtures-import` is non-destructive and skips existing files, so this
# survives re-imports. Loaded by testfixtures inside each test's rollback
# transaction.
- id: {{ id "tagging_should_be_lead_user" }}
  tag_id: {{ id "tag_should_be_lead" }}
  taggable_id: {{ id "user_flagged_as_lead" }}
  taggable_type: User
  context: tags
- id: {{ id "tagging_should_be_lead_survey_item" }}
  tag_id: {{ id "tag_should_be_lead" }}
  taggable_id: {{ id "user_flagged_as_lead" }}
  taggable_type: Survey::Item
  context: tags

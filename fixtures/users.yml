# Fixtures for `users`, HAND-CURATED (the admin CRUD surface maps only id, email,
# first_name, last_name, admin). Loaded by cmd/fixtures and the test containers
# (internal/fixture); only the mapped + NOT NULL columns are set, the rest default
# to null.
#
# Every row is named for the case it exists for, and says which tests lean on it.
# Give a case its own row rather than editing a row in a test.

# A second staff-bearing person who is also an administrator: user_admin_learner has no
# staff record on purpose (it is the harness user and many cases lean on that) and
# a staff record cannot be made for oneself, so a case about an administrator who
# is staff signs in as this user. Staff on the editor role (staff_member_admin_staff).
# Relied on by the audit trail, capability, self-protection and MCP cases.
# Written first so it is the oldest user: lists read newest first, and the cases
# that look at the first row of a list keep finding the row they always did.
# It is the third administrator, so the cases about the last administrators clear
# its flag first.
- id: {{ id "user_admin_staff" }}
  email: admin-staff@example.com
  first_name: Admin
  last_name: Staff
  admin: true
  created_at: '2026-07-26 20:50:44'
  updated_at: '2026-07-26 20:50:44'

# The user the test harness signs in as (testsupport.HarnessUserLabel): an
# administrator who is enrolled in JavaScript, has finished its first lesson,
# wrote blog posts and reviews, and has no staff record.
- id: {{ id "user_admin_learner" }}
  email: admin-learner@example.com
  password_digest: {{ password }}
  first_name: Admin
  last_name: Learner
  nickname: ally
  phone: '+10000000001'
  admin: true
  created_at: '2026-07-26 20:50:29'
  updated_at: '2026-07-26 20:50:29'

# A staff member (the editor role), not an administrator. Finished JavaScript,

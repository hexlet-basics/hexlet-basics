# Fixtures for `language_lesson_versions`, HAND-CURATED. Two jobs:
#
# 1. The review worker writes `language_lesson_reviews.language_lesson_version_id`
#    from each info's `version_id`, and that column carries a real FK — so the
#    lesson-version rows the infos point at (see language_lesson_version_infos.yml)
#    must exist. Each info points at the row for ITS OWN lesson; the id space
#    happens to overlap the course versions', which is a coincidence and not a
#    relationship.
#
# 2. `natural_order` on the CURRENT version's rows is the Position sequential
#    progression gates on: 1..N across the whole course, in build order. The
#    retired version (545350298) carries none — a Lesson only has a Position
#    relative to one Course Version.
#
# `path_to_code` is where the lesson's Makefile lives inside the exercise image.
# The runner needs it; the course version supplies the image itself and the name
# of the file the submitted code replaces.
#
# testfixtures disables FKs during load, so module_version_id parents need not
# exist. Course = JavaScript (82481401), current version 965227298.

# Fixtures for `active_storage_attachments` (ActiveStorage's polymorphic join).
# Binds the covers of blog_post_hello_world, blog_post_learning_ruby and
# blog_post_oldest_post to their blobs; blog_post_second_post has no cover row,
# so its cover variants read as null.
- id: {{ id "attachment_hello_world_cover" }}
  name: cover
  record_id: {{ id "blog_post_hello_world" }}
  record_type: BlogPost
  blob_id: {{ id "blob_cover" }}
  created_at: '2026-07-26 20:50:29'
- id: {{ id "attachment_learning_ruby_cover" }}
  name: cover
  record_id: {{ id "blog_post_learning_ruby" }}
  record_type: BlogPost
  blob_id: {{ id "blob_cover_ruby" }}
  created_at: '2026-07-27 10:00:00'
- id: {{ id "attachment_oldest_post_cover" }}
  name: cover
  record_id: {{ id "blog_post_oldest_post" }}
  record_type: BlogPost
  blob_id: {{ id "blob_cover_oldest" }}
  created_at: '2026-07-20 10:00:00'

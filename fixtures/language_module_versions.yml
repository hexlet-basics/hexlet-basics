# Fixtures for `language_module_versions`, HAND-CURATED (see
# language_modules.yml for why). Module version 1 is the one every lesson
# version in language_lesson_versions.yml already points at.
#
# The ids deliberately disagree with `order` on JavaScript's current version
# (version_javascript_current): the strings module is ordered last. The feed orders its plan by `order`, and
# this is what lets the golden file prove it.
- id: {{ id "module_version_javascript_10_basics_current" }}
  language_id: {{ id "course_javascript" }}
  language_version_id: {{ id "version_javascript_current" }}
  module_id: {{ id "module_javascript_10_basics" }}
  order: 10
  created_at: '2026-07-26 20:50:29'
  updated_at: '2026-07-26 20:50:29'

# Fixtures for `language_modules`, HAND-CURATED alongside
# language_module_versions.yml and language_module_version_infos.yml: the
# legacy module fixtures use crc32 ids that the hand-curated
# language_lesson_versions.yml (module_version_id 1) does not join to, and they
# fill descriptions with Faker, which would change the Yandex feed golden file
# on every re-export.
#
# JavaScript (course_javascript) gets three modules so its feed offer is emitted; Ruby
# (course_ruby) gets one so the feed's "fewer than three modules" skip has a
# course to skip. Slugs avoid `basics`, which lesson_progress_test seeds for
# JavaScript at runtime under the (language_id, slug) unique index.
- id: {{ id "module_javascript_10_basics" }}
  language_id: {{ id "course_javascript" }}
  slug: 10-basics
  order: 10
  state: active
  created_at: '2026-07-26 20:50:29'
  updated_at: '2026-07-26 20:50:29'

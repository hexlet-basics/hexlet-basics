- id: {{ id "blog_post_learning_ruby" }}
  name: Learning Ruby
  slug: learning-ruby
  description: Why Ruby is a good first language
  locale: ru
  state: published
  rich_body: '<p>Ruby часто советуют как первый язык, и не зря: код на нём читается почти как обычный английский, а порог входа ниже, чем у большинства языков.</p><h2>Простой синтаксис</h2><p>Не нужно объявлять типы, ставить точки с запятой и разбираться с шаблонным кодом. Программа из одной строки — это уже полноценная программа, которую можно сразу запустить и увидеть результат.</p><ul><li>Читаемый код помогает сосредоточиться на идеях, а не на синтаксисе</li><li>Богатая стандартная библиотека избавляет от лишних зависимостей</li><li>Большое дружелюбное сообщество и море материалов на русском</li></ul><h2>Куда пойти после основ</h2><p>Освоив базу, можно перейти к веб-разработке на Rails, писать скрипты для автоматизации или готовиться к работе в команде. Фундамент, который даёт Ruby, пригодится в любом из этих направлений.</p><pre><code>puts "Hello, world!"</code></pre><p>Начните с первого урока: на всё про всё уйдёт меньше десяти минут.</p>'
  creator_id: {{ id "user_staff_editor" }}
  related_language_items_count: 0
  created_at: '2026-07-27 10:00:00'
  updated_at: '2026-07-27 10:00:00'

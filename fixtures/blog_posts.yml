# Fixtures for `blog_posts`, HAND-CURATED. Admin read maps id, name, slug,
# description, locale, state, creator_id (embedded creator from users.yml),
# related_language_items_count, and the trusted rich_body HTML. Covers and likes
# live in active_storage_* / blog_post_likes. 6001 is the "full" post (rich body
# + cover + 2 likes); 6002 has none of those. The rest shape the public blog:
# ru published posts are 6003 (newest), 6001 and 5990 (oldest), so the list,
# next-post and recommended-post orders are all observable; 6004 is ru but
# archived and 6005 is en, so the locale and state scopes each exclude one.

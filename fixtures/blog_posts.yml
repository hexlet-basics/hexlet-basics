# Deleted by the delete tests, which run in parallel with the tests that replace
# blog_post_hello_world's related courses: a delete and a replace of one post's
# dependents take the same locks in opposite order and deadlock, so the delete
# has a post of its own, with the like and promoted courses a delete takes with
# it. An unpublished English draft, so no public blog list shows it.
- id: {{ id "blog_post_to_delete" }}

# Fixtures for `reviews`, HAND-CURATED. `language_id` points at courses from
# languages.yml (ruby=207281424, 1c=322905520, both with a current version) and
# `user_id` at users.yml, so the embedded course/user render in tests.
# testfixtures disables referential integrity during load and wraps each test in
# a rollback transaction. first_name/last_name are the reviewer's own display
# name (distinct from the linked user).
- id: {{ id "review_admin_learner_ruby_published" }}
  body: Отличный курс, всё понятно
  first_name: Ivan
  last_name: Petrov
  language_id: {{ id "course_ruby" }}
  user_id: {{ id "user_admin_learner" }}
  locale: ru
  pinned: true
  state: published
  created_at: '2026-07-26 20:50:29'
  updated_at: '2026-07-26 20:50:29'
- id: {{ id "review_staff_editor_1c_draft" }}
  body: Great course
  first_name: John
  last_name: Doe
  language_id: {{ id "course_1c" }}
  user_id: {{ id "user_staff_editor" }}
  locale: en
  pinned: false
  state: draft
  created_at: '2026-07-26 20:50:30'
  updated_at: '2026-07-26 20:50:30'
# The public list: a newer, unpinned ru review sorts above the pinned 5001

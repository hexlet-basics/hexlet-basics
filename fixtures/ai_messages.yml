# Fixtures for `ai_messages`, HAND-CURATED. The admin messages list maps id,
# role, content, user_id (null on assistant replies), token counts and the
# course/lesson identity enriched through the chat's lesson progress. The first
# two are a user question + assistant reply in user_admin_learner's hello-world
# lesson chat; the third is a lone question in user_staff_editor's variables
# lesson chat.
- id: {{ id "ai_message_admin_learner_javascript_hello_world_user" }}
  ai_chat_id: {{ id "ai_chat_admin_learner_javascript_hello_world" }}
  role: user
  content: 'How do I print a string?'
  user_id: {{ id "user_admin_learner" }}
  created_at: '2026-07-26 20:50:29'
  updated_at: '2026-07-26 20:50:29'
- id: {{ id "ai_message_admin_learner_javascript_hello_world_assistant" }}
  ai_chat_id: {{ id "ai_chat_admin_learner_javascript_hello_world" }}
  role: assistant
  content: 'Use console.log to print a string.'
  user_id:
  input_tokens: 120
  output_tokens: 45
  created_at: '2026-07-26 20:50:30'
  updated_at: '2026-07-26 20:50:30'
- id: {{ id "ai_message_staff_editor_javascript_variables_user" }}
  ai_chat_id: {{ id "ai_chat_staff_editor_javascript_variables" }}
  role: user
  content: 'What is a variable?'
  user_id: {{ id "user_staff_editor" }}
  created_at: '2026-07-26 20:50:31'
  updated_at: '2026-07-26 20:50:31'
# Provider bookkeeping (a system prompt) lives in the same table in production;
# the learner only ever sees the conversation.
- id: {{ id "ai_message_admin_learner_javascript_hello_world_system" }}

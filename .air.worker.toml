# Live-reload for the asynchronous Go worker.
root = "."
tmp_dir = "tmp/worker"

[build]
cmd = "go build -o ./tmp/worker/worker ./cmd/worker"
bin = "./tmp/worker/worker"
include_ext = ["go"]
include_dir = ["cmd", "internal", "ent"]
exclude_regex = ["_test\\.go"]
stop_on_error = true
delay = 300

[misc]
clean_on_exit = true

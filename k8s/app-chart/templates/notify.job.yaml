---

apiVersion: batch/v1
kind: Job
metadata:
  name: "{{ .Release.Name }}-notify-{{ .Chart.Version }}"
  namespace: "{{ .Release.Namespace }}"
  labels:
    {{- include "codebasics.labels" . | nindent 4 }}
  annotations:
    # Register the deploy in Sentry once per release, after a successful rollout
    # (a postStart hook used to send one per pod start and per replica).
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded

spec:
  backoffLimit: 1
  activeDeadlineSeconds: 120
  # Clean the finished Job up after an hour (before-hook-creation only cleans
  # on the next release).
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: "{{ .Release.Name }}-notify-pod"
        app.kubernetes.io/instance: "{{ .Release.Name }}"
        helm.sh/chart: '{{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}'
    spec:
      restartPolicy: Never

      {{- include "codebasics.podScheduling" . | nindent 6 }}

      affinity:
        {{- include "codebasics.nodeAffinity" "service" | nindent 8 }}

      containers:
        - name: notify
          image: {{ .Values.sentry.image }}
          args:
            - "deploys"
            - "new"
            - "--release"
            - "{{ .Chart.Version }}"
            - "-e"
            - "{{ .Values.sentry.environment }}"
          resources:
            requests:
              memory: "64Mi"
              cpu: "10m"
            limits:
              memory: '128Mi'
          env:
            # Self-hosted Sentry; otherwise sentry-cli talks to sentry.io.
            - name: SENTRY_URL
              value: "{{ .Values.sentry.url }}"
            - name: SENTRY_ORG
              value: "{{ .Values.sentry.org }}"
            # sentry-cli reads SENTRY_AUTH_TOKEN; the secret key is SENTRY_API_TOKEN.
            - name: SENTRY_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: codebasics-environment-secrets
                  key: SENTRY_API_TOKEN

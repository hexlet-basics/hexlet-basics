---

# The public Go API (cmd/server). No Docker socket: the exercise runner is
# resolved lazily, so this pod only fails a solution check, which the ingress
# never sends here (api-check owns it, ADR-0013).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: "{{ .Release.Name }}-api-deployment"
  namespace: "{{ .Release.Namespace }}"
  labels:
    {{- include "codebasics.labels" . | nindent 4 }}

spec:
  replicas: {{ .Values.api.replicas }}

  selector:
    matchLabels:
      app.kubernetes.io/name: "{{ .Release.Name }}-api-pod"
      app.kubernetes.io/instance: "{{ .Release.Name }}"
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      # One node per replica (anti-affinity below), so a rollout on two nodes
      # has to free one before the new pod can land.
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: "{{ .Release.Name }}-api-pod"
        app.kubernetes.io/instance: "{{ .Release.Name }}"
        helm.sh/chart: '{{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}'
        codebasics/pod: "{{ .Release.Name }}-{{ .Chart.Version }}-api-pod"
    spec:
      {{- include "codebasics.podScheduling" . | nindent 6 }}

      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: "codebasics/pod"
                    operator: In
                    values:
                      - "{{ .Release.Name }}-{{ .Chart.Version }}-api-pod"
              topologyKey: "kubernetes.io/hostname"
        {{- include "codebasics.nodeAffinity" "web" | nindent 8 }}

      # preStop sleep (ALB deregistration) + the server's 15s graceful shutdown
      # (cmd/server shutdownTimeout) must fit before SIGKILL.
      terminationGracePeriodSeconds: 30

      containers:
        - name: api
          imagePullPolicy: IfNotPresent
          image: {{ include "codebasics.goImage" . }}
          command: ["/server"]
          ports:
            - containerPort: 3001
          # TCP probes: the server listens only once its dependency graph (DB
          # included) is built, and there is no health operation in the
          # contract to probe over HTTP.
          startupProbe:
            tcpSocket:
              port: 3001
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            tcpSocket:
              port: 3001
            periodSeconds: 8
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 3001
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              memory: "100Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
          {{- include "codebasics.goEnv" . | nindent 10 }}
          # The ALB keeps sending for a few seconds after the pod is marked for
          # deletion; keep serving until it has noticed.
          # The built-in sleep action (Kubernetes 1.30+): the images have no
          # `sleep` binary for an exec hook.
          lifecycle:
            preStop:
              sleep:
                seconds: 10

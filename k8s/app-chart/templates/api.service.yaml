---

apiVersion: v1
kind: Service
metadata:
  name: "{{ .Release.Name }}-api-service"
  namespace: "{{ .Release.Namespace }}"
spec:
  selector:
    app.kubernetes.io/name: "{{ .Release.Name }}-api-pod"
  # NodePort: YC ALB targets node ports, as the legacy services did.
  type: NodePort
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3001

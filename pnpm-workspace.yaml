overrides:
  # Transitive copies that sat below the patched releases: undici comes in
  # through TypeSpec's @scalar/json-magic (build time), dompurify through
  # monaco-editor (ships to the browser as its HTML sanitizer).
  undici@7: ^7.29.1
  dompurify@3: ^3.4.16
  # postcss (build-time only) pins nanoid ^3.3.16; the fix for the
  # zero-size infinite loop (GHSA) landed in 3.3.17. Scoped to the 3.x line so
  # nothing gets dragged onto nanoid 6.
  nanoid@3: ^3.3.18
  # @hey-api/json-schema-ref-parser pins js-yaml exactly at 5.2.0, which carries
  # two parser-DoS advisories. Scoped to the 5.x line so the commitlint/TypeSpec
  # chain stays on js-yaml 4.
  js-yaml@5: ^5.2.3
allowBuilds:
  '@swc/core': true
  msw: true
  # Only the grammar sources are used (tree-sitter CLI compiles them); no node-gyp build.
  tree-sitter-javascript: false
  tree-sitter-typescript: false
  tree-sitter-go: false
  tree-sitter-c: false
  tree-sitter-cpp: false
  tree-sitter-c-sharp: false
  '@tree-sitter-grammars/tree-sitter-kotlin': false
  tree-sitter-make: false
  tree-sitter-bash: false
  tree-sitter-json: false
  '@tree-sitter-grammars/tree-sitter-yaml': false
  '@tree-sitter-grammars/tree-sitter-toml': false
  tree-sitter-ruby: false
  tree-sitter-python: false
  tree-sitter-css: false
  tree-sitter-html: false
  tree-sitter-embedded-template: false

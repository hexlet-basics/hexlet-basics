name: Tools

# Dependabot has no mise ecosystem, so mise.lock (and the exact pins of mise.toml) move only when
# someone bumps them. This keeps one issue open while a tool is behind its newest release, and
# closes it when the lock catches up.
on:
  schedule:
    - cron: '41 5 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  outdated:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10

      - name: Update the issue
        run: scripts/outdated_issue.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      # Installs Go + golangci-lint pinned in mise.toml (single source of truth
      # with local dev), and caches them between runs.
      - uses: jdx/mise-action@v2

      - run: pnpm install

      # gofmt + go vet + golangci-lint (Go) and biome + tsc (frontend).
      - run: make lint

  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: code_basics_test
          POSTGRES_PASSWORD: postgres
        ports:
          - 54330:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Matches internal/testsupport defaultTestDSN; the schema is auto-migrated
      # by the suite (ent), so no separate DB setup step is needed.
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:54330/code_basics_test

    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v2

      # The DB schema is owned by legacy Rails during the cutover (ADR-0002); the
      # Go repo carries a snapshot in db/structure.sql (regenerate with
      # `make db-dump-schema`). Load it with a matching pg client (the dump uses
      # psql 17.5+ `\restrict`), so the runner's own psql version can't break it.
      - name: Load database schema
        run: |
          docker run --rm --network host -e PGPASSWORD=postgres \
            -v "${{ github.workspace }}/db:/db:ro" postgres:17-alpine \
            psql -h 127.0.0.1 -p 54330 -U postgres -d code_basics_test \
            -v ON_ERROR_STOP=1 -q -f /db/structure.sql

      - run: make test

name: check

on:
  pull_request:
    branches:
      - main
  # Deliberately NOT `push: main`. Everything that reaches main either arrived
  # through a PR (already checked here) or was pushed directly by a maintainer,
  # whose pre-push hook runs `make lint` locally. Re-running on the merge commit
  # would only duplicate the PR's run.
  #
  # The release-please branch is the exception: its PR is opened by
  # github-actions[bot], whose pull_request runs sit unapproved, so the branch
  # is checked on push instead. Required status checks are evaluated per head
  # SHA regardless of which event produced them, so these runs still gate the
  # release PR.
  push:
    branches:
      - 'release-please--**'

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      # Installs Go + golangci-lint pinned in mise.toml (single source of truth
      # with local dev), and caches them between runs.
      - uses: jdx/mise-action@v2

      - run: pnpm install

      # gofmt + go vet + golangci-lint (Go) and tsc (frontend).
      - run: make lint

  test-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install

      # Vitest Browser Mode drives a real Chromium via Playwright; install it
      # (with OS deps) before running the frontend suite.
      - run: pnpm exec playwright install --with-deps chromium

      - run: make test-web

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v2

      # DB packages use testcontainers-go to start independent PostgreSQL 18
      # instances, apply Atlas migrations, and load the committed fixtures.
      - run: make test

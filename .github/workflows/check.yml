name: check

on:
  pull_request:
    branches:
      - main
  # Deliberately no `push` trigger. Everything that reaches main either arrived
  # through a PR (already checked here) or was pushed directly by a maintainer,
  # whose pre-push hook runs `mise run lint` locally. Re-running on the merge commit
  # would only duplicate the PR's run.
  #
  # Adding `push` for the release-please branch would not help either: refs
  # pushed with GITHUB_TOKEN do not start workflow runs at all, so that branch
  # is covered by its PR's run and nothing else.

# Read-only everywhere: no job in this workflow writes to the repository.
permissions:
  contents: read

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs the toolchain pinned in mise.toml (go, node, pnpm,
      # golangci-lint — single source of truth with local dev), and caches it
      # between runs.
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2

      # mise-action does not cache the pnpm store (setup-node used to); keyed on
      # the lockfile the same way the Go cache is keyed on go.sum.
      - id: pnpm-store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      # Neither job had a Go cache, so every run recompiled the dependency tree
      # from scratch. Keyed on go.sum: a dependency bump invalidates it, the
      # restore-key still seeds the next run from the previous tree.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}
          restore-keys: ${{ runner.os }}-go-

      # golangci-lint keeps its own analysis cache, separate from go-build; with
      # none, every run re-analyzed all packages with type information (~2 min).
      # Its entries are keyed by file content, so a stale cache is safe: the
      # sha suffix saves a fresh one each run and the restore-key seeds from the
      # latest.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/golangci-lint
          key: ${{ runner.os }}-golangci-${{ hashFiles('go.sum', '.golangci.yml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-golangci-${{ hashFiles('go.sum', '.golangci.yml') }}-
            ${{ runner.os }}-golangci-

      - run: pnpm install

      # gofmt + go vet + golangci-lint (Go) and tsc (frontend).
      - run: mise run lint

  # Regenerates every committed generated file (ent, ogen, hey-api, goverter,
  # locales, amoCRM client) and fails if the tree changes, so a schema or
  # contract edit cannot land without its generated output.
  gen-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2

      - id: pnpm-store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}
          restore-keys: ${{ runner.os }}-go-

      - run: pnpm install

      - run: mise run gen:check

  # Conventional Commits drive release-please; lint only the commits the pull
  # request adds. The hook checks them locally, this catches a bypassed hook.
  commits:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # commitlint reads the commits in the pull request's range.
          fetch-depth: 0
          persist-credentials: false

      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2

      - run: pnpm install --frozen-lockfile

      - name: Lint commit messages
        env:
          FROM: ${{ github.event.pull_request.base.sha }}
          TO: ${{ github.event.pull_request.head.sha }}
        run: pnpm exec commitlint --from "$FROM" --to "$TO"

  test-web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # node + pnpm pinned in mise.toml, same as local dev.
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2

      # mise-action does not cache the pnpm store (setup-node used to); keyed on
      # the lockfile the same way the Go cache is keyed on go.sum.
      - id: pnpm-store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - run: pnpm install

      # Vitest Browser Mode drives a real Chromium via Playwright; install it
      # (with OS deps) before running the frontend suite.
      - run: pnpm exec playwright install --with-deps chromium

      - run: mise run test:web

  # The end-to-end suite: Chromium against the built Go API and SSR frontend on
  # a PostgreSQL service container loaded with the committed fixtures
  # (mise run test:e2e). It needs no Docker of its own, unlike the Go suite.
  test-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        # Pinned by digest (jactionlint); move it with the postgres service of
        # the test job below and of nightly.yml.
        image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      E2E_DB_PORT: '5432'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2

      - id: pnpm-store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}
          restore-keys: ${{ runner.os }}-go-

      - run: pnpm install

      - run: pnpm exec playwright install --with-deps chromium

      - run: mise run test:e2e

      # The HTML report and the traces of the failing tests, only when there are some.
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            e2e/.report
            e2e/.results
          retention-days: 7

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        # Pinned by digest (jactionlint); the e2e job above and nightly.yml use the same image.
        image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DB_PORT: '5432'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2

      # Keyed on go.sum: a dependency bump invalidates it, the restore-key still
      # seeds the next run from the previous tree.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}
          restore-keys: ${{ runner.os }}-go-

      # DB packages clone their databases with pgtestdb on the service above,
      # from a template of the Atlas migrations and the committed fixtures.
      - run: mise run test

      # The exercise runner's container lifecycle needs a real daemon, which the
      # runner has; `test` leaves these out (build tag `docker`).
      - run: mise run test:docker

  # Builds both images without pushing, so a PR that breaks a Dockerfile (or
  # the files it copies) fails here rather than on the release run.
  build-images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - file: Dockerfile
            lock: go.sum
          - file: Dockerfile.web
            lock: pnpm-lock.yaml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Not `$/...`: that form unpacks the whole repository as an action, and the
      # runner fails on a symlink under .agents/skills.
      - uses: ./.github/actions/build-image # zizmor: ignore[self-repository]
        with:
          file: ${{ matrix.file }}
          lock: ${{ matrix.lock }}

  # Renders the chart with placeholder secrets (the real ones are sops-encrypted
  # and only decrypted on deploy), so a template error never reaches a release.
  # Renders the chart with placeholder secrets (the real ones are sops-encrypted
  # and only decrypted on deploy) and validates every manifest against the
  # Kubernetes schemas, so a template or schema error never reaches a release.
  helm-template:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2

      - run: mise run lint:helm

  # The client bundle must stay within the budgets in package.json (size-limit).
  bundle-size:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2

      - run: pnpm install --frozen-lockfile

      - run: mise run lint:size

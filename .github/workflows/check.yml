name: check

on:
  pull_request:
    branches:
      - main
  # Deliberately no `push` trigger. Everything that reaches main either arrived
  # through a PR (already checked here) or was pushed directly by a maintainer,
  # whose pre-push hook runs `make lint` locally. Re-running on the merge commit
  # would only duplicate the PR's run.
  #
  # Adding `push` for the release-please branch would not help either: refs
  # pushed with GITHUB_TOKEN do not start workflow runs at all, so that branch
  # is covered by its PR's run and nothing else.

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Installs the toolchain pinned in mise.toml (go, node, pnpm,
      # golangci-lint — single source of truth with local dev), and caches it
      # between runs.
      - uses: jdx/mise-action@v2

      # mise-action does not cache the pnpm store (setup-node used to); keyed on
      # the lockfile the same way the Go cache is keyed on go.sum.
      - id: pnpm-store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      # Neither job had a Go cache, so every run recompiled the dependency tree
      # from scratch. Keyed on go.sum: a dependency bump invalidates it, the
      # restore-key still seeds the next run from the previous tree.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}
          restore-keys: ${{ runner.os }}-go-

      - run: pnpm install

      # gofmt + go vet + golangci-lint (Go) and tsc (frontend).
      - run: make lint

  test-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # node + pnpm pinned in mise.toml, same as local dev.
      - uses: jdx/mise-action@v2

      # mise-action does not cache the pnpm store (setup-node used to); keyed on
      # the lockfile the same way the Go cache is keyed on go.sum.
      - id: pnpm-store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - run: pnpm install

      # Vitest Browser Mode drives a real Chromium via Playwright; install it
      # (with OS deps) before running the frontend suite.
      - run: pnpm exec playwright install --with-deps chromium

      - run: make test-web

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v2

      # Keyed on go.sum: a dependency bump invalidates it, the restore-key still
      # seeds the next run from the previous tree.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}
          restore-keys: ${{ runner.os }}-go-

      # DB packages use testcontainers-go to start independent PostgreSQL 18
      # instances, apply Atlas migrations, and load the committed fixtures.
      - run: make test

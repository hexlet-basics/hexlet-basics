name: check

on:
  pull_request:
    branches:
      - main
  # Agent work lands on main directly, with no pull request (docs/agents/git-workflow.md), and its
  # only gate before the push is the pre-push hook, which a bypass skips. This run checks what
  # landed. It also seeds the caches: a pull request restores caches saved on its own branch or on
  # the default one and saves none of the Go ones (.github/actions/go-cache), so main's run is what
  # every pull request starts from.
  #
  # The release-please branch is covered by its pull request's run: refs pushed with
  # GITHUB_TOKEN do not start workflow runs.
  push:
    branches:
      - main

# Read-only everywhere: no job in this workflow writes to the repository.
permissions:
  contents: read

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  # A run on main is never cancelled: it seeds the caches and checks a landed commit.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # lint:migrations compares with the merge base of origin/main.
          fetch-depth: 0

      # Installs the toolchain pinned in mise.toml (go, node, pnpm,
      # golangci-lint — single source of truth with local dev), and caches it
      # between runs.
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4

      # mise-action does not cache the pnpm store (setup-node used to); keyed on
      # the lockfile the same way the Go cache is keyed on go.sum.
      - id: pnpm-store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - uses: ./.github/actions/go-cache # zizmor: ignore[self-repository]
        with:
          scope: lint
          save-modules: 'true'

      # golangci-lint keeps its own analysis cache, separate from go-build; with
      # none, every run re-analyzed all packages with type information (~2 min).
      # Its entries are keyed by file content, so a stale cache is safe: the
      # sha suffix saves a fresh one each run and the restore-key seeds from the
      # latest.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/golangci-lint
          key: ${{ runner.os }}-golangci-${{ hashFiles('go.sum', '.golangci.yml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-golangci-${{ hashFiles('go.sum', '.golangci.yml') }}-
            ${{ runner.os }}-golangci-

      - run: pnpm install

      # gofmt + go vet + golangci-lint (Go) and tsc (frontend).
      - run: mise run lint

  # Package boundaries (easement.yml). Its indexers, scip-go and scip-typescript, type-check both
  # code bases: on the lint runner they would compete with golangci-lint and tsc for the cores.
  arch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4

      - id: pnpm-store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - uses: ./.github/actions/go-cache # zizmor: ignore[self-repository]
        with:
          scope: arch

      # scip-typescript type-checks the frontend against its dependencies.
      - run: pnpm install --frozen-lockfile

      # easement keeps each SCIP index under a key of the files its indexer reads, so a run that
      # changes no Go file reads scip-go's output from an earlier one instead of running it.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/easement
          key: easement-${{ runner.os }}-${{ github.sha }}
          restore-keys: easement-${{ runner.os }}-

      - run: mise run lint:arch

  # Regenerates every committed generated file (ent, ogen, hey-api, goverter,
  # locales, amoCRM client) and fails if the tree changes, so a schema or
  # contract edit cannot land without its generated output.
  gen-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4

      - id: pnpm-store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - uses: ./.github/actions/go-cache # zizmor: ignore[self-repository]
        with:
          scope: gen-check

      - run: pnpm install

      - run: mise run gen:check

  # Conventional Commits drive release-please; lint only the commits the pull
  # request adds. The hook checks them locally, this catches a bypassed hook.
  commits:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # commitlint reads the commits in the pull request's range.
          fetch-depth: 0
          persist-credentials: false

      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4

      - run: pnpm install --frozen-lockfile

      - name: Lint commit messages
        env:
          FROM: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          TO: ${{ github.sha }}
        run: |
          if [ -z "$FROM" ] || [ "$FROM" = "0000000000000000000000000000000000000000" ]; then
            echo "no base commit to compare against; skipping"
          else
            pnpm exec commitlint --from "$FROM" --to "$TO"
          fi

  # The pre-commit hook scans the staged changes; this scans the commits the pull
  # request adds, so a bypassed hook does not let a secret through.
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4

      - name: Scan the pull request's commits
        env:
          FROM: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          TO: ${{ github.sha }}
        run: |
          if [ -z "$FROM" ] || [ "$FROM" = "0000000000000000000000000000000000000000" ]; then
            echo "no base commit to compare against; skipping"
          else
            betterleaks git --log-opts="$FROM..$TO" --redact --no-banner .
          fi

  test-web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # node + pnpm pinned in mise.toml, same as local dev.
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4

      # mise-action does not cache the pnpm store (setup-node used to); keyed on
      # the lockfile the same way the Go cache is keyed on go.sum.
      - id: pnpm-store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - run: pnpm install

      # Vitest Browser Mode drives a real Chromium via Playwright; install it
      # (with OS deps) before running the frontend suite.
      - run: pnpm exec playwright install --with-deps chromium

      - run: mise run test:web

  # The end-to-end suite: Chromium against the built Go API and SSR frontend on
  # the `db` mise daemon (PostgreSQL, :54330) loaded with the committed fixtures
  # (mise run test:e2e starts the daemon itself). It needs no Docker of its own, unlike the Go suite.
  test-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4

      - id: pnpm-store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - uses: ./.github/actions/go-cache # zizmor: ignore[self-repository]
        with:
          scope: e2e

      - run: pnpm install

      - run: pnpm exec playwright install --with-deps chromium

      - run: mise run test:e2e

      # The e2e database is migrated and loaded; schemalens checks it against the ent schema.
      - run: mise run lint:schema

      # The HTML report and the traces of the failing tests, only when there are some.
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            e2e/.report
            e2e/.results
          retention-days: 7

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4

      - uses: ./.github/actions/go-cache # zizmor: ignore[self-repository]
        with:
          scope: test

      # DB packages clone their databases with pgtestdb on the service above,
      # from a template of the Atlas migrations and the committed fixtures.
      - run: mise run test

      # The exercise runner's container lifecycle needs a real daemon, which the
      # runner has; `test` leaves these out (build tag `docker`).
      - run: mise run test:docker

  # Builds both images without pushing, so a PR that breaks a Dockerfile (or
  # the files it copies) fails here rather than on the release run.
  build-images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - file: Dockerfile
            lock: go.sum
          - file: Dockerfile.web
            lock: pnpm-lock.yaml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Not `$/...`: that form unpacks the whole repository as an action, and the
      # runner fails on a symlink under .agents/skills.
      - uses: ./.github/actions/build-image # zizmor: ignore[self-repository]
        with:
          file: ${{ matrix.file }}
          lock: ${{ matrix.lock }}

  # Renders the chart with placeholder secrets (the real ones are sops-encrypted
  # and only decrypted on deploy), so a template error never reaches a release.
  # Renders the chart with placeholder secrets (the real ones are sops-encrypted
  # and only decrypted on deploy) and validates every manifest against the
  # Kubernetes schemas, so a template or schema error never reaches a release.
  helm-template:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4

      - run: mise run lint:helm

  # The client bundle must stay within the budgets in package.json (size-limit).
  bundle-size:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4

      - run: pnpm install --frozen-lockfile

      - run: mise run lint:size

  # The one check branch protection requires of this workflow: jobs can be split, merged or renamed
  # without touching the ruleset. `always()` makes it report a failure rather than be skipped.
  ci:
    if: always()
    needs: [lint, arch, gen-check, commits, secrets, test-web, test-e2e, test, build-images, helm-template, bundle-size]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            if [ "$result" != success ] && [ "$result" != skipped ]; then
              echo "a required job ended in: $result"
              exit 1
            fi
          done

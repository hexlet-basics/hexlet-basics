name: check

on:
  pull_request:
    branches:
      - main
  # Deliberately no `push` trigger. Everything that reaches main either arrived
  # through a PR (already checked here) or was pushed directly by a maintainer,
  # whose pre-push hook runs `make lint` locally. Re-running on the merge commit
  # would only duplicate the PR's run.
  #
  # Adding `push` for the release-please branch would not help either: refs
  # pushed with GITHUB_TOKEN do not start workflow runs at all, so that branch
  # is covered by its PR's run and nothing else.

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      # Installs the Go toolchain pinned in mise.toml (single source of truth
      # with local dev), and caches it between runs. golangci-lint itself is a
      # `tool` directive in go.mod, so `make lint` builds it via `go tool`.
      - uses: jdx/mise-action@v2

      # `tool` directives mean CI builds golangci-lint (and its analyzer tree)
      # from source, so the module and build caches are what keep that off the
      # critical path. Keyed on go.sum: a dependency bump invalidates it, the
      # restore-key still seeds the next run from the previous tree.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}
          restore-keys: ${{ runner.os }}-go-

      - run: pnpm install

      # gofmt + go vet + golangci-lint (Go) and tsc (frontend).
      - run: make lint

  test-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install

      # Vitest Browser Mode drives a real Chromium via Playwright; install it
      # (with OS deps) before running the frontend suite.
      - run: pnpm exec playwright install --with-deps chromium

      - run: make test-web

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v2

      # `tool` directives mean CI builds golangci-lint (and its analyzer tree)
      # from source, so the module and build caches are what keep that off the
      # critical path. Keyed on go.sum: a dependency bump invalidates it, the
      # restore-key still seeds the next run from the previous tree.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}
          restore-keys: ${{ runner.os }}-go-

      # DB packages use testcontainers-go to start independent PostgreSQL 18
      # instances, apply Atlas migrations, and load the committed fixtures.
      - run: make test

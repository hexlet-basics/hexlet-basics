name: check

on:
  pull_request:
    branches:
      - main
  # Deliberately no `push` trigger. Everything that reaches main either arrived
  # through a PR (already checked here) or was pushed directly by a maintainer,
  # whose pre-push hook runs `mise run lint` locally. Re-running on the merge commit
  # would only duplicate the PR's run.
  #
  # Adding `push` for the release-please branch would not help either: refs
  # pushed with GITHUB_TOKEN do not start workflow runs at all, so that branch
  # is covered by its PR's run and nothing else.

# Read-only everywhere: no job in this workflow writes to the repository.
permissions:
  contents: read

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs the toolchain pinned in mise.toml (go, node, pnpm,
      # golangci-lint — single source of truth with local dev), and caches it
      # between runs.
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2

      # mise-action does not cache the pnpm store (setup-node used to); keyed on
      # the lockfile the same way the Go cache is keyed on go.sum.
      - id: pnpm-store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      # Neither job had a Go cache, so every run recompiled the dependency tree
      # from scratch. Keyed on go.sum: a dependency bump invalidates it, the
      # restore-key still seeds the next run from the previous tree.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}
          restore-keys: ${{ runner.os }}-go-

      - run: pnpm install

      # gofmt + go vet + golangci-lint (Go) and tsc (frontend).
      - run: mise run lint

  # Regenerates every committed generated file (ent, ogen, hey-api, goverter,
  # locales, amoCRM client) and fails if the tree changes, so a schema or
  # contract edit cannot land without its generated output.
  gen-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2

      - id: pnpm-store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}
          restore-keys: ${{ runner.os }}-go-

      - run: pnpm install

      - run: mise run gen:check

  # Conventional Commits drive release-please; lint only the commits the pull
  # request adds. The hook checks them locally, this catches a bypassed hook.
  commits:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # commitlint reads the commits in the pull request's range.
          fetch-depth: 0
          persist-credentials: false

      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2

      - run: pnpm install --frozen-lockfile

      - name: Lint commit messages
        env:
          FROM: ${{ github.event.pull_request.base.sha }}
          TO: ${{ github.event.pull_request.head.sha }}
        run: pnpm exec commitlint --from "$FROM" --to "$TO"

  test-web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # node + pnpm pinned in mise.toml, same as local dev.
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2

      # mise-action does not cache the pnpm store (setup-node used to); keyed on
      # the lockfile the same way the Go cache is keyed on go.sum.
      - id: pnpm-store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - run: pnpm install

      # Vitest Browser Mode drives a real Chromium via Playwright; install it
      # (with OS deps) before running the frontend suite.
      - run: pnpm exec playwright install --with-deps chromium

      - run: mise run test:web

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2

      # Keyed on go.sum: a dependency bump invalidates it, the restore-key still
      # seeds the next run from the previous tree.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}
          restore-keys: ${{ runner.os }}-go-

      # DB packages use testcontainers-go to start independent PostgreSQL 18
      # instances, apply Atlas migrations, and load the committed fixtures.
      - run: mise run test

  # Builds both images without pushing, so a PR that breaks a Dockerfile (or
  # the files it copies) fails here rather than on the release run.
  build-images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        file: [Dockerfile, Dockerfile.web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.file }}
          push: false
          cache-from: type=gha,scope=${{ matrix.file }}
          cache-to: type=gha,mode=max,scope=${{ matrix.file }}

  # Renders the chart with placeholder secrets (the real ones are sops-encrypted
  # and only decrypted on deploy), so a template error never reaches a release.
  helm-template:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - run: >-
          helm lint k8s/app-chart
          --set secrets.docker.config=placeholder
          --set secrets.code_basics.env.DATABASE_URL=placeholder
      - run: >-
          helm template codebasics k8s/app-chart
          --set secrets.docker.config=placeholder
          --set secrets.code_basics.env.DATABASE_URL=placeholder
          --set migrate.baseline=20260727053619

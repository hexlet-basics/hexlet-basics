name: release-please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      # Bare semver (X.Y.Z) for the Docker tag / chart version; the `v` prefix
      # lives only in the git tag (tag_name), never in the image tag.
      version: ${{ steps.release.outputs.major }}.${{ steps.release.outputs.minor }}.${{ steps.release.outputs.patch }}
    steps:
      # Maintains a "release PR" from conventional commits: bumps package.json
      # (and any extra-files) and CHANGELOG.md. Merging that PR cuts a vX.Y.Z
      # tag + GitHub Release. Config: release-please-config.json +
      # .release-please-manifest.json.
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # Builds and pushes the Go and SSR images the chart deploys (k8s/app-chart),
  # tagged with the release version that Chart.yaml carries. It runs in the
  # same workflow run as release-please (triggered by the real push to main):
  # a release published with GITHUB_TOKEN does not trigger other workflows, so
  # a `release: published` trigger would never fire. GHCR takes GITHUB_TOKEN,
  # so no extra secret is needed; the cluster pulls with the docker-config
  # secret's ghcr.io credentials.
  build-images:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - file: Dockerfile
            image: ghcr.io/${{ github.repository }}
          - file: Dockerfile.web
            image: ghcr.io/${{ github.repository }}-web
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build & push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          tags: |
            ${{ matrix.image }}:${{ needs.release-please.outputs.version }}
            ${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.file }}
          cache-to: type=gha,mode=max,scope=${{ matrix.file }}

name: nightly

# Checks that do not need to run on every pull request: the coverage floors, and
# the dependency scan, whose answer changes with the advisory database rather
# than with our code. One scheduled run covers them; `workflow_dispatch` runs
# them on demand. A scheduled workflow only runs from the default branch.
on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

# Read-only everywhere: no job in this workflow writes to the repository.
permissions:
  contents: read

concurrency:
  group: nightly-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The Go suite over cmd/ and internal/, failing under the total in
  # .testcoverage.yml. The DB packages clone their databases on the service
  # PostgreSQL (TEST_DB_PORT), the same as the test job of check.yml.
  coverage-go:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        # Pinned by digest (jactionlint); move it with check.yml's postgres images.
        image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DB_PORT: '5432'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}
          restore-keys: ${{ runner.os }}-go-

      - run: mise run test:cover

  # The frontend suite with the thresholds in vite.config.ts (Vitest Browser
  # Mode, a real Chromium through Playwright).
  coverage-web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2

      - id: pnpm-store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - run: pnpm install
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:coverage

  # govulncheck. A new advisory can fail this with no change on our side, which
  # is why it runs here and not on a pull request.
  vulnerabilities:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2

      - run: mise run lint:vulns

  # Fills the image caches on main. A pull request's caches are private to its
  # branch and may read only its own and the default branch's, and check.yml
  # does not run on push to main, so without this every new PR built both
  # images from scratch. Same action and scopes as check.yml's build-images.
  warm-image-caches:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - file: Dockerfile
            lock: go.sum
          - file: Dockerfile.web
            lock: pnpm-lock.yaml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Not `$/...`: that form unpacks the whole repository as an action, and the
      # runner fails on a symlink under .agents/skills.
      - uses: ./.github/actions/build-image # zizmor: ignore[self-repository]
        with:
          file: ${{ matrix.file }}
          lock: ${{ matrix.lock }}

name: Go cache
description: >
  Restore the Go module cache and build cache, and save them on the default branch only. Go comes
  from mise, so actions/setup-go (which would install a second toolchain) is not used. A pull
  request only restores: the repository's cache is capped at 10 GB, and one entry per scope per
  pull request commit evicted main's entries, the only ones every pull request can read.

  The two caches are kept apart. The module cache depends on go.sum alone, so it is one entry for
  every job, saved once per set of dependencies by the job given `save-modules` (one that reads
  every module). The build cache is per scope: a run on main saves a fresh entry under a key
  ending in the commit and restores the newest one for the same dependencies, so it only ever
  grows by the packages that changed.

inputs:
  scope:
    description: Jobs build different things (tags, coverage); each keeps its own build cache.
    required: true
  fallback:
    description: A scope whose entry is restored when this one has none (a new or renamed scope).
    required: false
    default: ''
  save-modules:
    description: >
      Save the module cache when main has no entry for this go.sum. Set on one job only, one that
      downloads every module of every go.mod (the lint job): whichever job saves first decides
      what the entry holds.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Locate Go caches
      id: paths
      shell: bash
      run: |
        echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
        echo "mod=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"

    # Keyed by go.sum alone: a module, once downloaded, never changes.
    - name: Cache Go modules
      id: modules
      if: inputs.save-modules == 'true' && github.ref == 'refs/heads/main'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.paths.outputs.mod }}
        key: gomod-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
        restore-keys: gomod-${{ runner.os }}-

    # What the entry is saved with at the end of the job: every module of every go.mod, not only
    # those this job happens to build.
    - name: Download every module
      if: steps.modules.outcome == 'success' && steps.modules.outputs.cache-hit != 'true'
      shell: bash
      run: |
        git ls-files '*go.mod' | while read -r mod; do
          (cd "$(dirname "$mod")" && go mod download)
        done

    - name: Restore Go modules
      if: inputs.save-modules != 'true' || github.ref != 'refs/heads/main'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.paths.outputs.mod }}
        key: gomod-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
        restore-keys: gomod-${{ runner.os }}-

    - name: Cache Go build outputs
      if: github.ref == 'refs/heads/main'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.paths.outputs.build }}
        key: gobuild-${{ inputs.scope }}-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum', 'mise.toml') }}-${{ github.sha }}
        restore-keys: |
          gobuild-${{ inputs.scope }}-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum', 'mise.toml') }}-
          gobuild-${{ inputs.scope }}-${{ runner.os }}-
          gobuild-${{ inputs.fallback || inputs.scope }}-${{ runner.os }}-

    - name: Restore Go build outputs
      if: github.ref != 'refs/heads/main'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.paths.outputs.build }}
        key: gobuild-${{ inputs.scope }}-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum', 'mise.toml') }}-${{ github.sha }}
        restore-keys: |
          gobuild-${{ inputs.scope }}-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum', 'mise.toml') }}-
          gobuild-${{ inputs.scope }}-${{ runner.os }}-
          gobuild-${{ inputs.fallback || inputs.scope }}-${{ runner.os }}-

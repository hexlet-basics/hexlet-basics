name: build-image
description: >-
  Builds a Dockerfile without pushing, with the layer cache and the
  `RUN --mount=type=cache` directories (Go build cache, pnpm store) kept
  between runs.

inputs:
  file:
    description: Dockerfile to build
    required: true
  lock:
    description: Dependency lockfile that keys the cache mounts (go.sum, pnpm-lock.yaml)
    required: true

runs:
  using: composite
  steps:
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      id: buildx

    # BuildKit keeps cache mounts on the builder, not in the layer cache that
    # type=gha exports, so a fresh runner compiled every dependency again. The
    # dance copies the mounts out of the build into `cache-mount/` and back in on
    # the next run. actions/cache saves in its post step, which runs after the
    # dance's own post step has extracted, so it needs no explicit save.
    # nightly.yml fills this cache on main, where pull requests can read it.
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      id: cache
      with:
        path: cache-mount
        key: buildmount-${{ inputs.file }}-${{ hashFiles(inputs.file, inputs.lock) }}
        restore-keys: buildmount-${{ inputs.file }}-

    # Finds the mount targets by reading the Dockerfile.
    - uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723 # v3.4.0
      with:
        builder: ${{ steps.buildx.outputs.name }}
        dockerfile: ${{ inputs.file }}
        cache-dir: cache-mount
        skip-extraction: ${{ steps.cache.outputs.cache-hit }}

    - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        file: ${{ inputs.file }}
        push: false
        cache-from: type=gha,scope=${{ inputs.file }}
        cache-to: type=gha,mode=max,scope=${{ inputs.file }}

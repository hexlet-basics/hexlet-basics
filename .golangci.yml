version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - contextcheck
    - errorlint
    - forbidigo
    - noctx
    - rowserrcheck
    - sqlclosecheck
    - usetesting
  settings:
    forbidigo:
      forbid:
        # Persistence goes through ent builders; raw SQL in production code
        # splits the package between two idioms. Tests and testsupport (savepoints,
        # cleanup of non-ent tables) are exempt below.
        - pattern: '^.*\.(ExecContext|QueryContext|QueryRowContext)$'
          msg: use ent query builders instead of raw SQL
      analyze-types: false
  exclusions:
    paths:
      - internal/testsupport
    rules:
      - path: _test\.go
        linters: [forbidigo]
      # The handler tests read responses from httptest.ResponseRecorder, whose
      # body is an in-memory buffer: there is nothing to close.
      - path: internal/handlers/.*_test\.go
        linters: [bodyclose]

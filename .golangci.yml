version: "2"

linters:
  default: all
  # Policy (AGENTS.md, "Lint & Typecheck"): every linter is on; one is off only
  # with a reason written next to it here.
  disable:
    - exhaustruct # deprecated upstream, replaced by exhaustruct_v5, which is on
    - gomodguard # deprecated upstream, replaced by gomodguard_v2, which stays on
    - wsl # deprecated upstream, replaced by wsl_v5, which is on
    - exhaustive # ticket #910, blocked by two known MCP bugs
    - nilerr # ticket #910, blocked by two known MCP bugs
    # Pending: enabled by the commits that follow, each with its findings fixed.
    - varnamelen
    - paralleltest
    - tparallel
    - lll
    - goconst
    - noinlineerr
    - testpackage
    - cyclop
    - funlen
    - gocognit
    - nestif
  settings:
    wrapcheck:
      # An error that comes from another package of this module was wrapped where
      # it was made (ADR-0018: wrapped once, at the package boundary), so passing
      # it up as is does not duplicate the stack. Errors of ent and of the
      # libraries are what this checks.
      ignore-package-globs:
        - hexletbasics/internal/*
        - hexletbasics/cmd/*
    ireturn:
      # Returning an interface is the point where a library or a seam of ours
      # declares one: the OIDC and Watermill and ent contracts we implement, the
      # generated api response sum types, and the mailer's seam (AGENTS.md,
      # "Interfaces": the exception for a boundary with a second adapter).
      allow:
        - anon
        - error
        - empty
        - stdlib
        - generic
        - github.com/ThreeDotsLabs/watermill/.*
        - github.com/zitadel/oidc/v3/.*
        - entgo.io/ent/.*
        - github.com/samber/do/v2.Injector
        - hexletbasics/ent.Mutator
        - hexletbasics/internal/api.*
        - hexletbasics/internal/mailer.Mailer
    exhaustruct_v5:
      # Our own types, where a field left out is a decision to leave it out. The
      # structs of libraries, ent builders and the generated contract are filled
      # partially by design: their zero values are defined.
      explicit-mode: true
      enforce-patterns:
        - 'hexletbasics/.*'
      # Options structs whose zero value means "the default", by their own
      # documentation: the ent annotations the generators read and the embedded
      # mixin base.
      optional-patterns:
        - 'hexletbasics/ent/schema\.(?:Admin.*|TimestampsMixin)'
      ignore-patterns:
        - 'hexletbasics/internal/api\..*'
        - 'hexletbasics/internal/amocrm/generated\..*'
        - 'hexletbasics/ent\..*'
    tagliatelle:
      case:
        rules:
          # What we write is snake_case: domain events, the OAuth documents
          # (RFC 7591, RFC 8414), the course YAML. The contract's own camelCase
          # types are generated, not hand-tagged; packages that speak another
          # format say which below.
          json: snake
          yaml: snake
    depguard:
      rules:
        # Imports that have a replacement already in use. Everything else is
        # allowed (lax): the policy names what must not come in, not a list of
        # every dependency.
        banned:
          list-mode: lax
          files: ["$all"]
          deny:
            - pkg: math/rand$
              desc: use math/rand/v2
            - pkg: io/ioutil
              desc: deprecated since Go 1.16; use io and os
            - pkg: github.com/pkg/errors
              desc: ADR-0018 builds errors with samber/oops
            - pkg: golang.org/x/net/context
              desc: use the standard context package
            - pkg: ^log$
              desc: ADR-0026 logs with log/slog
        # ADR-0001: an operation's rules never see the generated contract types,
        # and the handlers that translate them are not imported back. Only the
        # adapters (handlers, apiconv, inputconv, paging, mcpserver, permission,
        # di, the commands) and the tests may touch internal/api.
        modules-do-not-know-the-contract:
          list-mode: lax
          files:
            - "$all"
            - "!**/internal/api/**"
            - "!**/internal/handlers/**"
            - "!**/internal/apiconv/**"
            - "!**/internal/inputconv/**"
            - "!**/internal/paging/**"
            - "!**/internal/mcpserver/**"
            - "!**/internal/permission/**"
            - "!**/internal/di/**"
            - "!**/internal/testsupport/**"
            - "!**/cmd/**"
            - "!$test"
          deny:
            - pkg: hexletbasics/internal/api
              desc: ADR-0001, a module takes a plain command, never a generated api type
            - pkg: hexletbasics/internal/handlers
              desc: a module does not depend on the HTTP adapter
    sloglint:
      # ADR-0026: *Context variants when a ctx is in scope, snake_case keys,
      # static messages, one call style (key-value pairs).
      context: scope
      static-msg: true
      key-naming-case: snake
      forbidden-keys: [error]
      no-mixed-args: true
    forbidigo:
      # With analyze-types the matched text is <package>.<Type>.<Method>, so a
      # pattern names the ent or database/sql type it guards and does not catch
      # a same-named method on an unrelated type.
      forbid:
        # Persistence goes through ent builders; raw SQL in production code
        # splits the package between two idioms. Tests and testsupport (savepoints,
        # reading the outbox) are exempt below.
        - pattern: '^sql\.(DB|Tx|Conn|Stmt)\.(ExecContext|QueryContext|QueryRowContext)$'
          msg: use ent query builders instead of raw SQL
        # The next two apply to tests only (see exclusions). A test arranges its
        # data from fixtures/ and never makes a row to act on: creating one is the
        # act of the code under test, so a test that does it says why with a nolint.
        - pattern: '^ent\.\w+Client\.(Create|CreateBulk)$'
          msg: creating rows in a test is not arrange; add the case to fixtures/ and look it up with fixtures.ID, or say with a nolint why the creation is the act under test
        - pattern: '^(sql\.Open|store\.NewDB)$'
          msg: creating rows in a test is not arrange; a test does not open its own connection, testsupport hands out one that is rolled back with the test
        # Handlers only translate the contract; what an operation does lives in a
        # use-case module (AGENTS.md, "Use-case modules"). The generated admin
        # helpers (AdminList, AdminGet, AdminCreate, AdminUpdate, AdminDelete)
        # are the module of an operation with no rules of its own, so they pass.
        - pattern: '^ent\.\w+Client\.(Query|Create|CreateBulk|MapCreateBulk|Update|UpdateOne|UpdateOneID|Delete|DeleteOne|DeleteOneID|Get|GetX)$'
          msg: a handler does not build ent queries; put the rule in a use-case module, or generate the admin CRUD from the schema's AdminCRUD annotation
        # domain.FromStore is the one translator of ent's errors; a handler asks
        # errors.Is(err, domain.ErrNotFound) and the like, never ent.Is*.
        - pattern: '^ent\.Is\w+$'
          msg: a handler does not read ent errors; the module returns domain errors (domain.FromStore) and the handler checks them with errors.Is
        # ADR-0018: errors are built with samber/oops, never fmt.Errorf. Tests
        # may use it (see the exclusion below); production code may not.
        - pattern: '^fmt\.Errorf$'
          msg: build the error with samber/oops (errs.With(...).Wrapf), see ADR-0018
      analyze-types: true
  exclusions:
    paths:
      - internal/testsupport
    rules:
      # ADR-0018: each package keeps one `errs` template (oops.In("<package>")),
      # the single place its error attributes are declared. A function in its
      # place would make every call site `errs()`.
      - linters: [gochecknoglobals]
        text: "errs is a global variable"
      # The DI graph (AGENTS.md, "Architecture: Handlers, DI, and Data"): each
      # process package is one do.Package value, the single place a service is
      # added; wrapping it in a function would only hide the same table.
      - path: ^internal/di/.*_package\.go$|^internal/di/closers\.go$
        linters: [gochecknoglobals]
        text: "Package is a global variable"
      # The backend message registry: `goi18n extract` reads the i18n.Message
      # literals of these package-level values into the locale catalogs.
      - path: ^internal/localization/
        linters: [gochecknoglobals]
      # revive's `exported` asks for a comment on every exported method. These
      # two families implement an interface that documents them: ent's
      # schema.Interface (Fields, Edges, ... of a table), and the generated
      # api.Handler, whose operations the TypeSpec describes. Every other
      # exported name still needs its comment.
      - path: ^ent/schema/
        linters: [revive]
        text: 'exported method \w+\.(Annotations|Fields|Edges|Indexes|Mixin) should have comment'
      - path: ^internal/handlers/
        linters: [revive]
        text: 'exported method Server\.\w+ should have comment'
      # Raw SQL stays available to tests (reading the outbox).
      - path: _test\.go
        linters: [forbidigo]
        text: use ent query builders
      # The test-only rules above do not apply to production code.
      - path-except: _test\.go
        linters: [forbidigo]
        text: creating rows in a test
      # The handler rule above is for the handlers' own code: the other packages
      # are the modules that build the queries, and tests arrange through them.
      - path-except: ^internal/handlers/
        linters: [forbidigo]
        text: a handler does not build ent queries
      - path: _test\.go
        linters: [forbidigo]
        text: a handler does not build ent queries
      - path-except: ^internal/handlers/
        linters: [forbidigo]
        text: a handler does not read ent errors
      - path: _test\.go
        linters: [forbidigo]
        text: a handler does not read ent errors
      # fmt.Errorf is allowed in tests.
      - path: _test\.go
        linters: [forbidigo]
        text: samber/oops
      # Packages not yet migrated to oops (ADR-0018). Shrink this list, never grow it.
      - path: ^(cmd/(fixturelabels|fixtures|server|worker)|internal/(accounts|amocrm|apiconv|assetstore|audit|coursepages|curriculum|di|domain|eventhandlers|events|exerciserunner|feeds|fixtures|handlers|jobs|leads|localization|permissions|progress|search|sessions|staffroles|store|telemetry))/
        linters: [forbidigo]
        text: samber/oops
      # The handler and OAuth server tests read responses from
      # httptest.ResponseRecorder, whose body is an in-memory buffer: there is
      # nothing to close.
      - path: internal/(handlers|oauthserver)/.*_test\.go
        linters: [bodyclose]

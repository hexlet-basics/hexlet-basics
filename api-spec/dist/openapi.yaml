openapi: 3.0.0
info:
  title: Hexlet Basics API
  description: |-
    Hexlet Basics API.

    Contract-first (ADR-0001): this TypeSpec compiles to `dist/openapi.yaml`
    (`pnpm spec`), which drives BOTH the Go server (ogen validators) and the TS
    frontend client + zod (hey-api, `pnpm generate`). Never hand-edit `dist/`.

    Naming: the domain concept is `Course`. The legacy Rails app called it
    `Language`; we keep `Language` ONLY in URL paths (e.g. `/languages`) for
    backward compatibility (ADR-0002), but every type/operation/schema uses
    `Course`. The full model/enum set lives in `models.tsp`.
  version: 0.0.0
tags:
  - name: Courses
  - name: Course Categories
  - name: Blog
  - name: Reviews
  - name: Pages
  - name: Leads
  - name: Marketing
  - name: Sitemap
  - name: Auth
  - name: User Area
  - name: 'Admin: Attachments'
  - name: 'Admin: Course Categories'
  - name: 'Admin: Banners'
  - name: 'Admin: Blog Posts'
  - name: 'Admin: Reviews'
  - name: 'Admin: Courses'
  - name: 'Admin: Course Landing Pages'
  - name: 'Admin: Course Lessons'
  - name: 'Admin: Course Lesson Members'
  - name: 'Admin: Course Lesson Reviews'
  - name: 'Admin: Leads'
  - name: 'Admin: Messages'
  - name: 'Admin: Users'
  - name: 'Admin: Roles'
  - name: 'Admin: Staff Members'
  - name: Lesson Player
paths:
  /account/passkeys:
    get:
      operationId: listPasskeys
      description: List the current user's passkeys.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserCredential'
        '401':
          description: The request is not authenticated (no/invalid session cookie).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
      tags:
        - User Area
    post:
      operationId: createPasskey
      description: Register a new passkey for the current user.
      parameters: []
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserCredential'
        '422':
          description: |-
            Field-level validation errors, keyed by field name (each value is the list
            of messages for that field). Returned when a write fails validation —
            including constraints the schema cannot express, like uniqueness.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
      tags:
        - User Area
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasskeyRegistrationInput'
  /account/passkeys/new:
    get:
      operationId: newPasskey
      description: Begin a passkey registration ceremony.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasskeyChallenge'
        '401':
          description: The request is not authenticated (no/invalid session cookie).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
      tags:
        - User Area
  /account/passkeys/{id}:
    delete:
      operationId: deletePasskey
      description: Remove a passkey.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '204':
          description: Empty 204 response for deletes and other content-less successes.
        '404':
          description: A resource was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
      tags:
        - User Area

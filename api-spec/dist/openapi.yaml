          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: A resource was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        default:
          description: |-
            Default error response shared by every operation.

            `@error` emits an OpenAPI `default` response, keeping central transport
            failures typed without enumerating every status on every operation.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      tags:
        - Lesson Player
      security:
        - UserSession: []
    post:
      operationId: createAssistantMessage
      description: |-
        Ask the assistant and stream its answer back. Both turns are stored once
        the answer is complete, with the answer's token usage.

        Asking is doing the lesson, so it starts the lesson when the learner has
        not yet. 429 once today's questions are used up — decided before anything
        streams.
      parameters:
        - name: lessonId
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: |-
            The assistant's answer, streamed as plain text while the model produces it.

            ogen generates a `text/plain` string body as an `io.Reader` the encoder copies
            straight to the socket, which is what lets tokens reach the learner as they
            arrive. (`bytes` would not do: TypeSpec emits it as `format: byte` for a text
            content type, and ogen then base64-encodes the stream.) SSE is out of reach — ogen
            cannot serve it yet (ogen#1742) — and the client does not need it: the AI SDK
            reads a plain text stream directly.
          content:
            text/plain:
              schema:
                type: string
        '401':
          description: The request is not authenticated (no/invalid session cookie).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: A resource was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '429':
          description: The learner has used up today's assistant questions.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        default:
          description: |-
            Default error response shared by every operation.

            `@error` emits an OpenAPI `default` response, keeping central transport
            failures typed without enumerating every status on every operation.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      tags:
        - Lesson Player
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssistantMessageInput'
      security:
        - UserSession: []

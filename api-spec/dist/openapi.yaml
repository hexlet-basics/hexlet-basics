components:
  parameters:
    ListQuery.page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        format: int32
      explode: false
    ListQuery.perPage:
      name: perPage
      in: query
      required: false
      schema:
        type: integer
        format: int32
      explode: false
    ListQuery.sortField:
      name: sortField
      in: query
      required: false
      description: Sort field (ransack `sf`).
      schema:
        type: string
      explode: false
    ListQuery.sortOrder:
      name: sortOrder
      in: query
      required: false
      description: Sort order (ransack `so`).
      schema:
        type: string
        enum:
          - asc
          - desc
      explode: false
  schemas:
    AssistantMessageInput:
      type: object
      required:
        - message
        - output
        - userCode
      properties:
        message:
          type: string
          minLength: 1
        output:
          type: string
          nullable: true
        userCode:
          type: string
          nullable: true
      description: A prompt to the in-lesson assistant, carrying the editor context.
    Attachment:
      type: object
      required:
        - id
        - url
        - filename
        - contentType
        - byteSize
      properties:
        id:
          type: integer
          format: int32
        url:
          type: string
        filename:
          type: string
        contentType:
          type: string
        byteSize:
          type: integer
          format: int64
      description: A stored blob (cover image, outcomes image) returned by the uploader.
    AttachmentUploadForm:
      type: object
      properties:
        file:
          type: string
          format: binary
      required:
        - file
    Banner:
      type: object
      required:
        - id
        - locale
        - body
        - url
        - background
        - state
        - startsAt
        - finishesAt
        - createdAt
      properties:
        id:
          type: integer
          format: int32
        locale:
          $ref: '#/components/schemas/BannerLocale'
        body:
          type: string
        url:
          type: string
          nullable: true
        background:
          $ref: '#/components/schemas/BannerBackground'
        state:
          $ref: '#/components/schemas/BannerState'
        startsAt:
          type: string
          format: date-time
          nullable: true
        finishesAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
      description: 'A site banner (legacy: `Banner`).'
    BannerBackground:
      type: string
      enum:
        - cta_gradient
        - dark
        - blue
      description: Banner display background.
    BannerInput:
      type: object
      required:
        - state
        - background
        - locale
        - body
        - url
        - startsAt
        - finishesAt
      properties:
        state:
          $ref: '#/components/schemas/BannerState'
        background:
          $ref: '#/components/schemas/BannerBackground'
        locale:
          $ref: '#/components/schemas/BannerLocale'
        body:
          type: string
          minLength: 1
        url:
          type: string
          nullable: true
        startsAt:
          type: string
          format: date-time
          nullable: true
        finishesAt:
          type: string
          format: date-time
          nullable: true
    BannerLocale:
      type: string
      enum:
        - ru
        - en
      description: Banners only target ru/en today (legacy `BannerLocale`).
    BannerPage:
      type: object
      required:
        - items
        - total
        - page
        - perPage
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Banner'
        total:
          type: integer
          format: int32
          description: Total rows across all pages (before pagination).
        page:
          type: integer
          format: int32
          description: 1-based page number this response represents.
        perPage:
          type: integer
          format: int32
          description: Page size used for this response.
      description: |-
        A page of results. Generic envelope reused by every admin list so the CRUD
        engine (TanStack Table) can read pagination uniformly.
    BannerState:
      type: string
      enum:
        - draft
        - published
        - archived
      description: Banner publication state.
    BlogPost:
      type: object
      required:
        - id
        - creator
        - name
        - slug
        - description
        - state
        - locale
        - url
        - richBodyHtml
        - readingTime
        - likesCount
        - relatedCourseItemsCount
        - coverThumbVariant
        - coverListVariant
        - coverMainVariant
        - createdAt
      properties:
        id:
          type: integer
          format: int32
        creator:
          $ref: '#/components/schemas/User'
        name:
          type: string
          nullable: true
        slug:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        state:
          allOf:
            - $ref: '#/components/schemas/BlogPostState'
          nullable: true
        locale:
          type: string
          nullable: true
        url:
          type: string
        richBodyHtml:
          type: string
        readingTime:
          type: integer
          format: int32
        likesCount:
          type: integer
          format: int32
        relatedCourseItemsCount:
          type: integer
          format: int32
        coverThumbVariant:
          type: string
          nullable: true
        coverListVariant:
          type: string
          nullable: true
        coverMainVariant:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
      description: 'A blog post (legacy: `BlogPost`).'
    BlogPostInput:
      type: object
      required:
        - name
        - slug
        - description
        - state
        - richBody
        - coverAttachmentId
      properties:
        name:
          type: string
          nullable: true
        slug:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        state:
          allOf:
            - $ref: '#/components/schemas/BlogPostState'
          nullable: true
        richBody:
          type: string
          description: Markdown/rich source; `richBodyHtml` is derived on read.
        coverAttachmentId:
          type: integer
          format: int32
          nullable: true
          description: Attachment id from `POST /admin/attachments`, or null to keep/clear.
    BlogPostPage:
      type: object
      required:
        - items
        - total
        - page
        - perPage
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/BlogPost'
        total:
          type: integer
          format: int32
          description: Total rows across all pages (before pagination).
        page:
          type: integer
          format: int32
          description: 1-based page number this response represents.
        perPage:
          type: integer
          format: int32
          description: Page size used for this response.
      description: |-
        A page of results. Generic envelope reused by every admin list so the CRUD
        engine (TanStack Table) can read pagination uniformly.
    BlogPostRelatedCoursesInput:
      type: object
      required:
        - courseIds
      properties:
        courseIds:
          type: array
          items:
            type: integer
            format: int32
      description: The set of courses promoted on a blog post.
    BlogPostState:
      type: string
      enum:
        - draft
        - published
        - archived
      description: Blog post publication state.
    BookRequestInput:
      type: object
      required:
        - email
        - fullName
      properties:
        email:
          type: string
          minLength: 1
        fullName:
          type: string
          nullable: true
      description: A request to download the free book (ru marketing funnel).
    CheckLessonInput:
      type: object
      required:
        - code
        - versionId
      properties:
        code:
          type: string
          minLength: 1
        versionId:
          type: integer
          format: int32
          description: The lesson version the code was written against.
      description: A submitted solution to run against the lesson's tests.
    Course:
      type: object
      required:
        - id
        - slug
        - name
        - learnAs
        - progress
        - categoryId
        - currentVersionId
        - currentVersion
        - createdAt
        - membersCount
        - lessonsCount
        - ratingCount
        - ratingValue
        - repositoryUrl
        - hexletProgramLandingPage
        - coverListVariant
        - coverThumbVariant
      properties:
        id:
          type: integer
          format: int32
        slug:
          type: string
        name:
          type: string
          nullable: true
        learnAs:
          allOf:
            - $ref: '#/components/schemas/CourseLearnAs'
          nullable: true
        progress:
          allOf:
            - $ref: '#/components/schemas/CourseProgress'
          nullable: true
        categoryId:
          type: integer
          format: int32
          nullable: true
        currentVersionId:
          type: integer
          format: int32
          nullable: true
        currentVersion:
          type: object
          allOf:
            - $ref: '#/components/schemas/CourseVersion'
          nullable: true
        createdAt:
          type: string
          format: date-time
        membersCount:
          type: integer
          format: int32
        lessonsCount:
          type: integer
          format: int32
        ratingCount:

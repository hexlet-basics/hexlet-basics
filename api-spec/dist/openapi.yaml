        id:
          type: integer
          format: int32
        slug:
          type: string
        header:
          type: string
          nullable: true
        name:
          type: string
          nullable: true
        locale:
          type: string
          nullable: true
        enrollmentsCount:
          type: integer
          format: int32
        duration:
          type: integer
          format: int32

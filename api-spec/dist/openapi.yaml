          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LessonAssistantMessage'
        '401':
          description: The request is not authenticated (no/invalid session cookie).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
      tags:
        - Lesson Player
    post:
      operationId: createAssistantMessage
      description: |-
        Ask the assistant. Enqueues generation (river job); the reply is delivered
        out-of-band. 202 = accepted, 429 = rate limited. SSE streaming is TBD.
      parameters:
        - name: lessonId
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '202':
          description: The request has been accepted for processing, but processing has not yet completed.
        '401':
          description: The request is not authenticated (no/invalid session cookie).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
      tags:
        - Lesson Player
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssistantMessageInput'

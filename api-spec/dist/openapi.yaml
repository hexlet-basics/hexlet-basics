openapi: 3.0.0
info:
  title: Hexlet Basics API
  description: |-
    Hexlet Basics API.

    Naming: the domain concept is `Course`. The legacy Rails app called it
    `Language`; we keep `Language` ONLY in URL paths (e.g. `/languages`) for
    backward compatibility, but every type/operation/schema uses `Course`.
  version: 0.0.0
tags:
  - name: Courses
  - name: 'Admin: Course Categories'
paths:
  /admin/language_categories:
    get:
      operationId: adminListCourseCategories
      description: List course categories (paginated).
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            format: int32
          explode: false
        - name: perPage
          in: query
          required: false
          schema:
            type: integer
            format: int32
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                  - total
                  - page
                  - perPage
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/CourseCategory'
                  total:
                    type: integer
                    format: int32
                    description: Total rows across all pages (before pagination).
                  page:
                    type: integer
                    format: int32
                    description: 1-based page number this response represents.
                  perPage:
                    type: integer
                    format: int32
                    description: Page size used for this response.
                description: A page of results. Generic envelope reused by every admin list.
      tags:
        - 'Admin: Course Categories'
    post:
      operationId: adminCreateCourseCategory
      description: Create a course category.
      parameters: []
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseCategory'
        '422':
          description: |-
            Field-level validation errors, keyed by field name (each value is the list
            of messages for that field). Returned when a write fails validation —
            including constraints the schema cannot express, like uniqueness.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
      tags:
        - 'Admin: Course Categories'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseCategoryInput'
  /admin/language_categories/{id}:
    get:
      operationId: adminGetCourseCategory
      description: Get a single course category.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseCategory'
      tags:
        - 'Admin: Course Categories'
    put:
      operationId: adminUpdateCourseCategory
      description: Update a course category.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseCategory'
        '422':
          description: |-
            Field-level validation errors, keyed by field name (each value is the list
            of messages for that field). Returned when a write fails validation —
            including constraints the schema cannot express, like uniqueness.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
      tags:
        - 'Admin: Course Categories'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseCategoryInput'
    delete:
      operationId: adminDeleteCourseCategory
      description: Delete a course category.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '204':
          description: 'There is no content to send for this request, but the headers may be useful. '
      tags:
        - 'Admin: Course Categories'
  /languages:
    get:
      operationId: listCourses
      description: List the published course catalog.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CourseCatalogItem'
      tags:
        - Courses
components:
  schemas:
    Course:
      type: object
      required:
        - id
        - slug
        - name
        - learnAs
        - progress
        - membersCount
        - lessonsCount
        - categoryId
      properties:
        id:
          type: integer
          format: int32
        slug:
          type: string
        name:
          type: string
          nullable: true
        learnAs:
          allOf:
            - $ref: '#/components/schemas/CourseLearnAs'
          nullable: true
        progress:
          allOf:
            - $ref: '#/components/schemas/CourseProgress'
          nullable: true
        membersCount:
          type: integer
          format: int32
        lessonsCount:
          type: integer
          format: int32
        categoryId:
          type: integer
          format: int32
          nullable: true
      description: 'A course (legacy: `Language`).'
    CourseCatalogItem:
      type: object
      required:
        - id
        - slug
        - header
        - name
        - locale
        - membersCount
        - duration
        - coverUrl
        - course
      properties:
        id:
          type: integer
          format: int32
        slug:
          type: string
        header:
          type: string
          nullable: true
        name:
          type: string
          nullable: true
        locale:
          type: string
          nullable: true
        membersCount:
          type: integer
          format: int32
        duration:
          type: integer
          format: int32
          description: Estimated duration in hours (derived from lesson count).
        coverUrl:
          type: string
          nullable: true
          description: Course cover image URL; null until assets are re-uploaded.
        course:
          $ref: '#/components/schemas/Course'
      description: 'A catalog entry as shown on the courses index (legacy: LanguageLandingPageForLists).'
    CourseCategory:
      type: object
      required:
        - id
        - slug
        - name
        - header
        - description
        - locale
        - createdAt
      properties:
        id:
          type: integer
          format: int32
        slug:
          type: string
          nullable: true
        name:
          type: string
          nullable: true
        header:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        locale:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
      description: 'A course category (legacy table: `language_categories`).'
    CourseCategoryInput:
      type: object
      required:
        - name
        - header
        - slug
        - description
      properties:
        name:
          type: string
          minLength: 1
        header:
          type: string
          minLength: 1
        slug:
          type: string
          minLength: 1
        description:
          type: string
          nullable: true
      description: Writable fields for creating or updating a course category.
    CourseLearnAs:
      type: string
      enum:
        - first_language
        - second_language
      description: How a course is meant to be learned.
    CourseProgress:
      type: string
      enum:
        - completed
        - in_development
        - draft
      description: Publication/readiness state of a course.
    ValidationError:
      type: object
      required:
        - errors
      properties:
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
      description: |-
        Field-level validation errors, keyed by field name (each value is the list
        of messages for that field). Returned when a write fails validation —
        including constraints the schema cannot express, like uniqueness.

          type: string
          description: Host the user is sent back to after deciding.
        scopes:
          type: array
          items:
            type: string
          description: 'What the application asks for: OAuth scopes (`catalog:read`, `progress:read`, `admin`, `offline_access`).'
        accountName:
          type: string

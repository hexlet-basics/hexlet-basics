components:
  parameters:
    AuditRecordQuery.actorUserId:
      name: actorUserId
      in: query
      required: false
      schema:
        type: integer
        format: int32
      explode: false
    AuditRecordQuery.channel:
      name: channel
      in: query
      required: false
      schema:
        type: string
        enum:
          - web
          - mcp
      explode: false
    AuditRecordQuery.entityId:
      name: entityId
      in: query
      required: false
      schema:
        type: string
      explode: false
    AuditRecordQuery.entityType:
      name: entityType
      in: query
      required: false
      schema:
        type: string
      explode: false
    AuditRecordQuery.from:
      name: from
      in: query
      required: false
      description: Start of the window (inclusive).
      schema:
        type: string
        format: date-time
      explode: false
    AuditRecordQuery.operation:
      name: operation
      in: query
      required: false
      schema:
        type: string
      explode: false
    AuditRecordQuery.page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        format: int32
        minimum: 1
      explode: false
    AuditRecordQuery.perPage:
      name: perPage
      in: query
      required: false
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
      explode: false
    AuditRecordQuery.to:
      name: to
      in: query
      required: false
      description: End of the window (exclusive).
      schema:
        type: string
        format: date-time
      explode: false
    ListQuery.page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        format: int32
        minimum: 1
      explode: false
    ListQuery.perPage:
      name: perPage
      in: query
      required: false
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 20
      explode: false
  schemas:
    ActiveBanner:
      type: object
      required:
        - banner
      properties:
        banner:
          type: object
          allOf:
            - $ref: '#/components/schemas/Banner'
          nullable: true
      description: The banner shown above the pages that carry one, or null when none is live.
    AdjacentLessons:
      type: object
      required:
        - previous
        - next
      properties:
        previous:
          type: object
          allOf:
            - $ref: '#/components/schemas/LessonRef'
          nullable: true
        next:
          type: object
          allOf:
            - $ref: '#/components/schemas/LessonRef'
          nullable: true
      description: The Lessons on either side of one Lesson in course order. Not the Next Lesson.
    AssistantMessageInput:
      type: object
      required:
        - message
        - output
        - userCode
      properties:
        message:
          type: string
          minLength: 1
        output:
          type: string
          nullable: true
        userCode:
          type: string
          nullable: true
      description: A prompt to the in-lesson assistant, carrying the editor context.
    Attachment:
      type: object
      required:
        - id
        - url
        - filename
        - contentType
        - byteSize
      properties:
        id:
          type: integer
          format: int32
        url:
          type: string
        filename:
          type: string
        contentType:
          type: string
        byteSize:
          type: integer
          format: int64
      description: A stored blob (cover image, outcomes image) returned by the uploader.
    AttachmentUploadForm:
      type: object
      properties:
        file:
          type: string
          format: binary
      required:
        - file
    AuditChange:
      type: object
      required:
        - entity
        - op
      properties:
        entity:
          type: string
          description: The ent entity type, e.g. `BlogPost`.
        id:
          type: string
        op:
          type: string
          description: create, update or delete.
        fields:
          type: array
          items:
            $ref: '#/components/schemas/AuditFieldChange'
      description: One mutation of one entity inside an operation. A bulk change carries no id.
    AuditFieldChange:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        old: {}
        new: {}
        secret:
          type: boolean
      description: |-
        The old and new value of one field an operation changed. `old` is absent on a
        create and `new` on a delete. A `secret` field (password material, a token)
        carries its name only: no value was ever stored. The values are JSON of any
        shape, as the field held them.
    AuditReads:
      type: object
      required:
        - count
      properties:
        count:
          type: integer
          format: int32
        ids:
          type: array
          items:
            type: string
      description: |-
        What a read of personal data touched: how many rows and, up to a cap, their
        ids. Identifiers and counts only, never a field value.
    AuditRecord:
      type: object
      required:
        - id
        - occurredAt
        - actorUserId
        - channel
        - connectedAppId
        - tokenId
        - requestId
        - address
        - userAgent
        - operation
        - entityType
        - entityId
        - locale
        - outcome
        - changes
        - reads
      properties:
        id:
          type: integer
          format: int64
        occurredAt:
          type: string
          format: date-time
        actorUserId:
          type: integer
          format: int32
          nullable: true
          description: Null for a refusal of a caller who was not signed in.
        channel:
          type: string
          enum:
            - web
            - mcp
        connectedAppId:
          type: integer
          format: int32
          nullable: true
        tokenId:
          type: string
          nullable: true
        requestId:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
        userAgent:
          type: string
          nullable: true
        operation:
          type: string
          description: The operation name, e.g. `AdminUpdateBlogPost`.
        entityType:
          type: string
          nullable: true
        entityId:
          type: string
          nullable: true
        locale:
          type: string
          nullable: true
        outcome:
          type: string
          enum:
            - succeeded
            - forbidden
            - failed
        changes:
          type: array
          items:
            $ref: '#/components/schemas/AuditChange'
        reads:
          type: object
          allOf:
            - $ref: '#/components/schemas/AuditReads'
          nullable: true
      description: |-
        One Audit Record: who did what, through which channel, to which entity, and
        how it ended (legacy: none, the trail is new). A change carries `changes`, a
        read of personal data carries `reads`, a refusal carries neither.
    AuditRecordPage:
      type: object
      required:
        - items
        - total
        - page
        - perPage
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditRecord'
        total:
          type: integer
          format: int32
          description: Total rows across all pages (before pagination).
        page:
          type: integer
          format: int32
          description: 1-based page number this response represents.
        perPage:
          type: integer
          format: int32
          description: Page size used for this response.
      description: |-
        A page of results. Generic envelope reused by every admin list so the CRUD
        engine (TanStack Table) can read pagination uniformly.
    Banner:
      type: object
      required:
        - id
        - locale
        - body
        - url
        - background
        - state
        - startsAt
        - finishesAt
        - createdAt
      properties:
        id:
          type: integer
          format: int32
        locale:
          $ref: '#/components/schemas/BannerLocale'
        body:
          type: string
        url:
          type: string
          nullable: true
        background:
          $ref: '#/components/schemas/BannerBackground'
        state:
          $ref: '#/components/schemas/BannerState'
        startsAt:
          type: string
          format: date-time
          nullable: true
        finishesAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
      description: 'A site banner (legacy: `Banner`).'
    BannerBackground:
      type: string
      enum:
        - cta_gradient
        - dark
        - blue

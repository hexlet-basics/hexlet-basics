            lesson page opens its meta description with it, in brackets.
        result:
          type: string
          nullable: true
        state:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
      description: A build/version of a course's exercises (legacy `LanguageVersion`).
    CourseView:
      type: object
      required:
        - course
        - landingPage
        - movedTo
        - lessons
        - modules
        - qnaItems
        - enrollment
        - progress
      properties:
        course:
          $ref: '#/components/schemas/Course'
        landingPage:
          type: object
          allOf:
            - $ref: '#/components/schemas/CourseLandingPage'
          nullable: true
        movedTo:
          type: string
          nullable: true
          description: |-
            Set when the landing page was archived: the landing page slug its URL moved
            to — the page the archived one names, else the course's main page in the
            request locale — which the page answers with a permanent redirect, as
            legacy's `languages#show` did. An archived page with neither is a 404, where
            legacy sent the visitor to the site root: a page that is gone says so. It

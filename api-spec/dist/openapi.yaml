      description: |-
        Update a user. 404 (missing) and 409 (duplicate email) both flow through
              the central ent-error handler.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserCrud'
      tags:
        - 'Admin: Users'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserInput'
    delete:
      operationId: adminDeleteUser

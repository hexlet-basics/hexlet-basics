# Default Betterleaks rules, plus the few files whose content only looks like a
# secret.
[extend]
useDefault = true

[[allowlists]]
description = "_typos.toml lists path fragments such as internal/api that the generic-api-key rule takes for a key"
paths = ['''^_typos\.toml$''']

[[allowlists]]
description = "atlas.sum holds one integrity hash per migration file, which the generic-api-key rule takes for a key"
paths = ['''^migrations/atlas\.sum$''']

# Project tasks, included from mise.toml (`[task_config] includes`).
#   mise tasks          list them
#   mise run <task>     run one
# Replaces the old Makefile; the dev stack itself is the [daemons] table in mise.toml.
# The Rails app in legacy/ keeps its own Makefile.
#
# Ordering: `depends` runs in parallel in mise, unlike Make prerequisites. Where
# order matters (the codegen pipeline), steps are a `run` list, which is sequential.

# --- setup -----------------------------------------------------------------------

[install]
description = "Install project dependencies (go modules + frontend/api-spec via the root package.json)"
run = ["go mod download", "pnpm install"]

[setup]
description = "Full local bootstrap from scratch: toolchain + git hooks, seed .env, then the `install` task (dependencies), `db:fixtures` (db daemon, migrations, starting data) and `dev` (API, worker and Vite daemons)"
run = [
  "mise install",
  "hk install --mise",
  "cp -n .env.example .env || true",
  { task = "install" },
  { task = "db:fixtures" },
  { task = "dev" },
]

# --- dev stack (daemons in mise.toml) ---------------------------------------------

["db:up"]
description = "Start the local Postgres daemon (:54330) and idempotently create the development database"
quiet = true
run = '''
#!/usr/bin/env bash
set -euo pipefail
host=${DB_HOST:-127.0.0.1}
port=${DB_PORT:-54330}
name=${DEV_DB_NAME:-code_basics_development}
# A server already answering on the port is used as is (the daemon, an external one).
if ! nc -z "$host" "$port" 2>/dev/null; then
  mise daemons start db >/dev/null 2>&1 || true
  for _ in $(seq 1 120); do nc -z "$host" "$port" 2>/dev/null && break; sleep 0.5; done
  nc -z "$host" "$port" 2>/dev/null || { echo "db:up: Postgres did not come up on $host:$port; see: mise daemons logs db" >&2; exit 1; }
fi
psql=psql
command -v psql >/dev/null || psql="mise x postgres@18 -- psql"
admin=(-X -q -t -A -h "$host" -p "$port" -U postgres -d postgres)
if ! $psql "${admin[@]}" -c "select 1 from pg_database where datname = '$name'" | grep -q 1; then
  $psql "${admin[@]}" -c "create database \"$name\""
fi
'''

[dev]
description = "Run API + async worker (air live-reload) + Vite as daemons; stop with `mise run dev:down`"
depends = ["db:up"]
run = "mise daemons start api worker web"

["dev:down"]
description = "Stop the API, worker and Vite daemons (never the database: it is a standing service)"
run = "mise daemons stop api worker web"

["dev:api"]
description = "Run only the Go API server in the foreground with live-reload (port from API_PORT)"
depends = ["db:up"]
run = "go tool air"

["dev:worker"]
description = "Run only the async Go worker in the foreground with live-reload"
depends = ["db:up"]
run = "go tool air -c .air.worker.toml"

["dev:web"]
description = "Run only the Vite frontend in the foreground"
run = "pnpm exec vite dev"

["dev:spec"]
description = "Watch TypeSpec and re-emit OpenAPI on change"
run = "pnpm spec:watch"

# --- database ----------------------------------------------------------------------

["db:migrate-new"]
description = "Scaffold a new empty migration to hand-author, then re-hash: `mise run db:migrate-new add_widgets`"
usage = 'arg "<name>" help="migration name, e.g. add_widgets"'
run = [
  'atlas migrate new "${usage_name}" --dir "file://migrations"',
  'atlas migrate hash --dir "file://migrations"',
]

["db:migrate"]
description = "Apply atlas migrations to the development DB"
depends = ["db:up"]
run = 'atlas migrate apply --env local --url "${DEV_DB_URL:-postgres://postgres:postgres@127.0.0.1:54330/code_basics_development?sslmode=disable}&search_path=public"'

["db:prepare"]
description = "Create and migrate the development DB without replacing its data"
run = [{ task = "db:up" }, { task = "db:migrate" }]

["storage:fixtures"]
description = "Generate the placeholder cover images the fixtures reference into the local storage/ bucket (git-ignored)"
run = "go run ./scripts/fixture_covers"

["db:fixtures"]
description = "Migrate the development DB and load fixtures/ into it, replacing the data in the fixture tables (the old `rails db:fixtures:load`), and generate the images they point at"
depends = ["db:migrate", "storage:fixtures"]
run = 'go run ./cmd/fixtures -any-database -conn "${DEV_DB_URL:-postgres://postgres:postgres@127.0.0.1:54330/code_basics_development?sslmode=disable}" -dir fixtures'

# --- code generation (contract is the source of truth, ADR-0001) -------------------

["gen:spec"]
description = "Compile TypeSpec to api-spec/dist/openapi.yaml"
run = "pnpm spec"

["gen:api"]
description = "Generate the ogen Go server from OpenAPI"
run = "go generate ./internal/apigen"

["gen:client"]
description = "Generate the hey-api TS client + Query hooks from OpenAPI"
run = "pnpm generate"

["gen:admin"]
description = "Generate the admin form-field and list-column descriptors from api-spec/dist/openapi.yaml (scripts/gen-admin-fields.ts)"
run = "pnpm generate:admin"

["gen:locales"]
description = "Extract the English backend catalog from the message registry"
run = "go generate ./internal/localization"

["gen:amocrm"]
description = "Generate the typed amoCRM client from the pinned upstream contract"
run = "go generate ./internal/amocrm"

["gen:ent"]
description = "Regenerate the ent ORM from ent/schema"
run = "go generate ./ent"

["gen:fixtures"]
description = "Generate the fixture label variables (internal/fixtures/labels_gen.go) from fixtures/*.yml"
run = "go generate ./internal/fixtures"

["gen:mocks"]
description = "Generate the harness mocks (moq) from the production interfaces they replace"
run = "go generate ./internal/testsupport"

[gen]
description = "Full contract pipeline: TypeSpec -> OpenAPI -> ogen server + hey-api client + admin field descriptors"
run = [{ task = "gen:spec" }, { task = "gen:api" }, { task = "gen:client" }, { task = "gen:admin" }]

["gen:all"]
description = "Regenerate everything: ent + contracts + locales + external clients + test mocks + fixture labels"
run = [
  { task = "gen:ent" },
  { task = "gen" },
  { task = "gen:locales" },
  { task = "gen:amocrm" },
  { task = "gen:mocks" },
  { task = "gen:fixtures" },
]

["gen:check"]
description = "Fail when committed generated code differs from what gen:all produces (CI gate; needs a clean tree)"
run = [
  { task = "gen:all" },
  '''test -z "$(git status --porcelain)" || { echo 'generated code is out of date; run `mise run gen:all` and commit:'; git status --short; git diff | head -80; exit 1; }''',
]

[tidy]
description = "Prune/sync go.mod after generation or dep changes"
run = "go mod tidy"

["fixtures:import"]
description = "Convert legacy Rails fixtures into Go testfixtures YAML in fixtures/ (non-destructive; FORCE=1 overwrites, ONLY=t1,t2 scopes). Borrows the Rails runtime; adds no files to legacy/"
dir = "legacy"
env = { RAILS_ENV = "test" }
run = "bin/rails runner ../scripts/export_fixtures.rb"

# --- lint & typecheck ---------------------------------------------------------------

[lint]
description = "Lint Go + frontend + ADR numbering + dependency health"
depends = [
  "lint:go",
  "lint:web",
  "lint:syntax",
  "lint:adr",
  "lint:deps",
  "lint:triggers",
  "lint:typos",
  "lint:workflows",
  "lint:shell",
]

["lint:triggers"]
description = "No database triggers of our own (river's are the only ones); the two audit migrations are the history of one that was dropped"
run = '''
if rg -n -i --glob '!*river_backbone*' --glob '!*audit_records.sql' --glob '!*partition_audit_records.sql' --glob '!*drop_audit_append_only_trigger.sql' 'create (or replace )?(constraint )?trigger' migrations; then
  echo "a migration creates a trigger: we keep no triggers of our own" >&2
  exit 1
fi
'''

["lint:typos"]
description = "Spelling in code, docs and comments (_typos.toml)"
run = "typos"

["lint:i18n"]
description = "i18n: resources.d.ts is current, no hardcoded strings outside the per-language pages, no key missing from a locale catalog (i18next.config.ts)"
run = '''
#!/usr/bin/env bash
set -euo pipefail
pnpm exec i18next-cli types --ci
pnpm exec i18next-cli lint
# `extract --ci` also exits 1 for array-valued keys it only re-serializes (a "~"
# line whose before and after are identical), so only its "+" lines, a key
# missing from a catalog, are a failure here.
missing=$(pnpm exec i18next-cli extract --ci --dry-run 2>&1 | grep -E '\[(ru|es|en)\]$|^ +\+ ' || true)
if echo "$missing" | grep -q '^ *+ '; then
  echo "keys missing from a locale catalog (add them, or run: pnpm exec i18next-cli sync):"
  echo "$missing"
  exit 1
fi
'''

["lint:unused"]
description = "Unused files, exports and dependencies of the frontend (knip.ts)"
run = "pnpm exec knip"

["lint:helm"]
description = "Helm chart: lint, then render with the CI placeholder values (and the cutover baseline) and validate every manifest against the Kubernetes schemas"
run = '''
#!/usr/bin/env bash
set -euo pipefail
chart=k8s/app-chart
set=(--set secrets.docker.config=placeholder --set secrets.code_basics.env.DATABASE_URL=placeholder)
kc=(kubeconform -strict -summary -ignore-missing-schemas)
helm lint "$chart" "${set[@]}"
helm template codebasics "$chart" "${set[@]}" | "${kc[@]}"
helm template codebasics "$chart" "${set[@]}" --set migrate.baseline=20260727053619 | "${kc[@]}"

# Routing (ADR-0022): every `full` host sends the MCP and OAuth paths to the Go
# api service ahead of the `/` catch-all, and a host without `full` sends only
# `/` (web). Paths of one host, in order, as "<host> <path> <service>" lines.
paths=$(helm template codebasics "$chart" "${set[@]}" --show-only templates/ingress.yaml | awk '
  /^  name: / { main = ($2 == "\"codebasics-ingress\"") }
  /^    - host: / { host = substr($3, 2, length($3) - 2) }
  /^ *- path: / { path = substr($3, 2, length($3) - 2) }
  /^ *name: .*-service"/ { svc = substr($2, 2, length($2) - 2); sub(/^codebasics-/, "", svc); if (main) print host, path, svc }')
want='/api/lessons/[0-9]+/check api-check-service /api/ api-service /mcp api-service /\.well-known/oauth-authorization-server api-service /\.well-known/openid-configuration api-service /\.well-known/oauth-protected-resource api-service /\.well-known/oauth-protected-resource/mcp api-service /oauth/ api-service / web-service'
for host in '*.code-basics.com' code-basics.com; do
  got=$(awk -v h="$host" '$1 == h { print $2, $3 }' <<<"$paths" | paste -sd' ' -)
  [ "$got" = "$want" ] || { echo "ingress routes of $host changed: $got"; exit 1; }
done
got=$(awk '$1 == "code-basics.ru" { print $2, $3 }' <<<"$paths" | paste -sd' ' -)
[ "$got" = "/ web-service" ] || { echo "code-basics.ru must route only / to web, got: $got"; exit 1; }
'''

["lint:infra"]
description = "Terraform (legacy/terraform): fmt --check, then init without the backend and validate in a scratch copy, so no credentials, state or yc_config.json are needed"
run = '''
#!/usr/bin/env bash
set -euo pipefail
tf=legacy/terraform
terraform -chdir="$tf" fmt -check -diff -recursive
scratch=$(mktemp -d)
trap 'rm -rf "$scratch"' EXIT
cp -R "$tf/." "$scratch"
# The yandex provider reads this key file while validating its configuration.
echo '{}' > "$scratch/yc_config.json"
terraform -chdir="$scratch" init -backend=false -input=false -lockfile=readonly
terraform -chdir="$scratch" validate
'''

["lint:size"]
description = "Client bundle budgets (size-limit config in package.json); builds the web app first"
run = ["pnpm build", "pnpm exec size-limit"]

["lint:shell"]
description = "shellcheck the scripts under scripts/ (the legacy and third-party skill scripts are not ours)"
run = "shellcheck -x scripts/*.sh scripts/oneoff/*/*.sh"

["lint:workflows"]
description = "GitHub workflows: zizmor (security) and jactionlint (correctness)"
run = ["zizmor --no-progress .github", "jactionlint .github/workflows/*.yml"]

["lint:deps"]
description = "go.mod is tidy"
run = "go mod tidy -diff"

["lint:vulns"]
description = "The code calls no known-vulnerable dependency or stdlib function (network: the vulnerability database). Not part of lint: a new advisory fails it with no change on our side, so the nightly workflow runs it"
run = "go tool govulncheck ./..."

["lint:adr"]
description = "ADR numbers are unique (a merge of main can bring a second ADR with the same number)"
run = '''
nums=$(ls docs/adr | sed -n 's/^\([0-9][0-9]*\)-.*/\1/p')
dup=$(echo "$nums" | sort | uniq -d)
if [ -n "$dup" ]; then
  next=$(printf '%04d' $(( $(echo "$nums" | sort -n | tail -1 | sed 's/^0*//') + 1 )))
  echo "error: duplicate ADR numbers in docs/adr: $(echo $dup); renumber the newer file (next free: $next)"; exit 1
fi
'''

["lint:locales"]
description = "Verify generated source messages and complete translations"
run = "sh scripts/lint_locales.sh"

["lint:go"]
description = "Locale catalogs, gofmt, go vet, golangci-lint (skips generated files)"
depends = ["lint:locales", "lint:go:vet", "lint:go:golangci"]

# vet and golangci-lint are separate tasks so mise runs them side by side: each
# spends its time type-checking the same packages, and in series that was the
# longest step of the CI lint job.
["lint:go:vet"]
description = "gofmt and go vet"
run = '''
#!/usr/bin/env bash
set -euo pipefail
unformatted=$(gofmt -l cmd internal ent/schema)
if [ -n "$unformatted" ]; then echo "gofmt needed:"; echo "$unformatted"; exit 1; fi
go vet ./...
'''

["lint:go:golangci"]
description = "golangci-lint (.golangci.yml; skips generated files)"
run = "golangci-lint run"

["lint:web"]
description = "oxlint, oxfmt check, and the TypeScript project build"
run = ["pnpm lint", "pnpm format:check", "pnpm check"]

["lint:syntax"]
description = "tree-sitter parses the TS/TSX, JS, Go, Python, Ruby, CSS, HTML, ERB, YAML, TOML and JSON files and fails on a syntax error (independent of tsc, go vet and the other linters)"
run = '''
#!/usr/bin/env bash
set -uo pipefail
# One grammar per language, taken from the tree-sitter-* npm packages (the CLI compiles
# them on first use). Exit status carries the result; the "no parser directories"
# warning is noise. Not parsed:
# - SQL and shell: their grammars flag valid Postgres and nested bash expansions (atlas and
#   shellcheck cover them);
# - Helm templates and Rails fixtures: templated YAML;
# - Sorbet RBIs: generated, and they use `def self(...)`, which the Ruby grammar rejects;
# - Terraform and Dockerfiles: no usable grammar package (`lint:infra` validates Terraform).
status=0
# `parse --grammar-path` recompiles the grammar on every run (it implies --rebuild), so each
# one is built once into node_modules/.cache/tree-sitter and loaded with --lib-path; it is
# rebuilt when the grammar's parser.c is newer than the library.
libs=node_modules/.cache/tree-sitter
mkdir -p "$libs"
check() {
  local lang=$1 grammar=node_modules/$2; shift 2
  local lib=$libs/$lang.dylib
  if [ ! -e "$lib" ] || [ "$grammar/src/parser.c" -nt "$lib" ]; then
    tree-sitter build --output "$lib" "$grammar" >&2 || { status=1; return; }
  fi
  local out
  out=$(git ls-files -z -- "$@" ':(exclude,glob)**/app-chart/templates/**' ':!legacy/sorbet/rbi' ':!legacy/test/fixtures' |
    xargs -0 -r tree-sitter parse --quiet --lib-path "$lib" --lang-name "$lang" 2>&1 |
    grep -E 'ERROR|MISSING|Error' | grep -v 'parser directories') || true
  if [ -n "$out" ]; then echo "$out"; status=1; fi
}
# legacy's TSX carries a bare `&` the TSX grammar rejects.
check tsx tree-sitter-typescript/tsx '*.ts' '*.tsx' ':!legacy'
check javascript tree-sitter-javascript '*.js' '*.mjs' '*.cjs' '*.jsx'
check python tree-sitter-python '*.py'
check ruby tree-sitter-ruby '*.rb' '*.rbi' '*.rake'
check css tree-sitter-css '*.css'
check html tree-sitter-html '*.html'
check embedded_template tree-sitter-embedded-template '*.erb'
check go tree-sitter-go '*.go'
check yaml @tree-sitter-grammars/tree-sitter-yaml '*.yml' '*.yaml'
check toml @tree-sitter-grammars/tree-sitter-toml '*.toml'
check json tree-sitter-json '*.json'
exit $status
'''

["lint:fix"]
description = "Auto-fix Go and frontend formatting and lint findings"
run = [
  "gofmt -w cmd internal ent/schema",
  "golangci-lint run --fix || true",
  "pnpm lint:fix",
  "pnpm format",
  "typos --write-changes",
]

# --- test --------------------------------------------------------------------------

[test]
description = "Run the Go suite; DB packages clone their database on the db daemon (needs `mise run db:up`). Shuffles only under CI: a fixed shuffle disables go's result cache. Pass packages/flags after `--`"
usage = 'arg "[go_test_args]" var=#true default="./..." help="packages and flags for go test"'
run = 'eval "set -- $usage_go_test_args"; go test -race ${CI:+-shuffle=on} "$@"'

["test:docker"]
description = "Run the tests that need a real Docker daemon (build tag `docker`: the exercise runner's container lifecycle). Not part of `test`; CI runs it"
run = "go test -tags=docker ./internal/exerciserunner"

["test:cover"]
description = "Run the Go suite with coverage over cmd/ and internal/ and fail under the total threshold in .testcoverage.yml (needs `mise run db:up`)"
run = [
  "go test -race -tags=docker -shuffle=on ./... -coverpkg=./cmd/...,./internal/... -coverprofile=cover.out -covermode=atomic",
  "go tool go-test-coverage --config=.testcoverage.yml",
]

["test:web"]
description = "Run the frontend suite (Vitest Browser Mode via Playwright; needs `pnpm exec playwright install chromium` once)"
run = "pnpm test"

["test:e2e:db"]
description = "Recreate the end-to-end database code_basics_e2e_test: atlas migrations + the committed fixtures (E2E_DB_HOST/E2E_DB_PORT, default the db daemon on :54330)"
run = "scripts/e2e_db.sh"

["test:e2e"]
description = "End-to-end suite: a real browser against the built Go API and SSR frontend (needs the db daemon, `mise run db:up`, and `pnpm exec playwright install chromium` once). Pass Playwright flags after `--`"
usage = 'arg "[playwright_args]" var=#true default="" help="flags for playwright test, e.g. --headed or a file name"'
run = [
  { task = "test:e2e:db" },
  "go build -o bin/server ./cmd/server",
  "pnpm exec vite build --outDir e2e/.build",
  'eval "set -- $usage_playwright_args"; pnpm exec playwright test -c e2e/playwright.config.ts "$@"',
]

# --- build -------------------------------------------------------------------------

["build:api"]
description = "Compile the Go server to bin/server"
run = "go build -o bin/server ./cmd/server"

["build:worker"]
description = "Compile the async runtime to bin/worker"
run = "go build -o bin/worker ./cmd/worker"

["build:web"]
description = "Build the production frontend bundle"
run = "pnpm build"

[build]
description = "Build the API, async worker, and frontend bundle"
depends = ["build:api", "build:worker", "build:web"]

[clean]
description = "Remove build artifacts"
run = "rm -rf bin dist"

# --- maintenance -------------------------------------------------------------------

["deps:update"]
description = "Bump Go + frontend (incl. api-spec) dependencies to latest; then run gen:all, lint and test"
run = [
  "go get -u ./...",
  "go mod tidy",
  "pnpm dlx npm-check-updates -u",
  "pnpm install",
  "echo '>> deps bumped: run `mise run gen:all`, then `mise run lint` and `mise run test` to verify'",
]

["skills:update"]
description = "Update the project's agent skills"
run = "pnpm dlx skills update --project --yes"

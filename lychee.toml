# Link checks over the Markdown of the repository (mise run lint:links, offline, part of
# `lint` and the pre-push hook; mise run lint:links:remote, the network, run by the nightly
# workflow).
include_fragments = "full"
max_concurrency = 8
max_retries = 3
retry_wait_time = 5
timeout = 30
cache = true
max_cache_age = "1d"
# 429 is a rate limit, not a broken link; GITHUB_TOKEN (read from the environment) keeps
# github.com links clear of it.
accept = ["200..=204", "429"]
# CHANGELOG.md is generated by release-please from commit messages; node_modules and .claude (the
# worktrees of the other checkouts) are not ours, .agents holds vendored skills and testdata holds
# fixtures, and a glob input does not read the ignore file.
exclude_path = [
  "(^|/)CHANGELOG\\.md$",
  "(^|/)node_modules/",
  "(^|/)\\.claude/",
  "(^|/)\\.agents/",
  "(^|/)testdata/",
]
# npmjs.com answers a GitHub runner with 403 (bot protection); the links are fine in a browser.
exclude = ["^https://www.npmjs.com/", "^https?://localhost", "^https?://127\\.0\\.0\\.1"]

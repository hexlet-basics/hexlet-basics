# typos: spelling in code, docs and comments. Generated code, vendored trees,
# lockfiles, the translated catalogs and the sample course (ru/es are not English)
# are skipped.
[files]
extend-exclude = [
  "legacy",
  ".agents",
  ".claude",
  "node_modules",
  "dist",
  "src/client",
  "src/routeTree.gen.ts",
  "src/locales/ru",
  "src/locales/es",
  "internal/api",
  "internal/amocrm/generated",
  "internal/apiconv/apiconv.gen.go",
  "internal/testsupport/mock_*_gen.go",
  "internal/localization/locales",
  "api-spec/dist",
  "ent/*.go",
  "ent/*/",
  "!ent/schema",
  "migrations",
  "fixtures",
  "internal/courseloader/testdata",
  "docs/research",
  "k8s/app-chart/secrets",
  "public/mockServiceWorker.js",
  "go.mod",
  "pnpm-lock.yaml",
  "go.sum",
  "*.lock",
]

[default.extend-words]
# Intentional fragments: a deliberately misspelled YAML key in a parser test, a
# streamed chunk cut mid-word, a "NAMEs" plural in a comment, the legacy Ruby
# method Lesson#localed_info, and Spanish words in GLOSSARY.md.
descriptio = "descriptio"
Hel = "Hel"
NAM = "NAM"
localed = "localed"
curso = "curso"
inicial = "inicial"
autor = "autor"

[default]
# The name of the live ingress address in Yandex Cloud (terraform/vpc.tf): renaming
# it would change the resource, so the misspelling stays.
extend-ignore-re = ["code-basics-ingress-adress-1"]

# Git hooks managed by lefthook (installed via the `prepare` npm script).
# Rails/legacy keeps its own hooks under legacy/.
commit-msg:
  commands:
    commitlint:
      run: npx --no -- commitlint --edit {1}

pre-push:
  parallel: true
  commands:
    lint-go:
      run: make lint-go
    lint-web:
      run: make lint-web
